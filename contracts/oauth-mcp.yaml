openapi: 3.1.0
info:
  title: Todolino OAuth und MCP
  version: 1.14.0
  description: >-
    OAuth-Consent als JSON-API. Keine Browser-Consent-Seite vorhanden.
    MCP Streamable HTTP mit Initialize-Profil bis 2025-11-25; keine vollständige
    Konformität mit 2026-07-28. Reale Clientkompatibilität separat prüfen.
    Scopes comments:write, attachments:read und agents:read ergänzen die Werkzeuge
    (siehe x-mcp-tools); jeder Aufruf prüft Scope, Grant-Projektliste und die aktuelle
    Rolle des Benutzers wie die REST-Routen.
    1.4.0 (ADR 0033, additiv): list_schedule (Kalenderfenster wie GET /v1/planning/schedule); get/update_task_planning tragen plannedMinutes
    und plannedAllDay (update: plannedMinutes 5 bis 1440 oder null, plannedAllDay braucht plannedAt; autoStart wird abgelehnt, invalid_arguments).
    1.5.0 (ADR 0033 Stufe C, additiv): start_agent_job nimmt releaseID (UUID, Idempotenz, release_id_conflict, invalid_release_id) und origin
    (manual|scheduler, invalid_origin); origin scheduler verlangt Kontoschalter und Karten-Erlaubnis (auto_start_disabled_for_account,
    auto_start_not_enabled, task_done, task_blocked). get_task_planning und list_schedule liefern autoStart/autoStartedAt mit echten Werten;
    Schreibzugriffe über update_task, update_task_planning und Sync widerrufen autoStart (Aktivität agent.auto_start_revoked).
    get_system_status liefert autoStartAllowed.
    1.7.0 (Karte 21CF716D, additiv, Handbuch 1.42.0): update_task_planning und get_task_planning tragen in recurrence optional weekdays (Array ganzer Zahlen 1 bis 7,
    nur weekly, eindeutig, nicht leer), basis (due|completion) und monthDay (1 bis 31, nur monthly); null gilt wie nicht gesetzt; ungültige Werte oder Kombinationen: invalid_recurrence.
    Fehlende Felder erscheinen nicht in den Antworten. Der Erledigungszeitpunkt für basis completion ist der Serverzeitpunkt der Erledigung.
    1.8.0 (Karte 74EC341D, additiv, Handbuch 1.43.0, contracts/pipeline.yaml 1.0.0): neue Werkzeuge get_task_pipeline (tasks:read), set_task_plan,
    decide_plan (Brain-Vollmacht und quote wie decide_review, cannot_decide_own_plan) und set_pipeline_step (tasks:write); wait_for_events kennt
    zusätzlich die Hinweisarten plan und pipeline. Keine neuen Scopes.
    1.9.0 (Karte B926E7D8, Pipeline Stufe 2, additiv, Handbuch 1.44.0, contracts/pipeline.yaml 1.1.0): neue Werkzeuge get_pipeline_settings (projects:read),
    update_pipeline_settings (projects:write; Recht manage am Projekt, Brain-Vollmacht für Verbindung und Projekt plus quote, Pflichtfeld revision) und
    retry_pipeline_step (tasks:write); set_pipeline_step nimmt optional planVersion; get_task_pipeline liefert zusätzlich settings, fixRounds,
    waitingApproval und je Schritt enabled, planVersion, role. Neue Fehlercodes: invalid_pipeline_settings, invalid_model, invalid_effort,
    invalid_plan_version, revision_conflict, step_disabled, step_not_failed, fix_rounds_exhausted. Keine neuen Scopes.
    1.10.0 (Karte F5DD1C00, Pipeline Stufe 3, additiv, Handbuch 1.45.0, contracts/pipeline.yaml 1.2.0): neues Werkzeug start_pipeline_execution
    (runs:write, Rechte und Prüfungen wie start_agent_job); get_task_pipeline liefert zusätzlich execution; retry_pipeline_step durch eine
    Verbindung startet nichts (paused/continue_required). Kein Fortsetzen über MCP. Neue Fehlercodes: execution_id_conflict, execution_active,
    nothing_to_run, invalid_execution_id. Keine neuen Scopes.
    1.11.0 (Karte BEF08998, ADR 0036, additiv, Handbuch 1.47.0): ein gerade rotiertes Refresh-Token darf 300 s lang erneut vorgelegt werden,
    solange keiner seiner Nachfolger benutzt wurde; GET /oauth/authorize kann takeover bzw. takeover_ambiguous liefern, POST /oauth/consent nimmt
    takeover_grant_id (409 takeover_changed); Grants tragen revoked_reason.
    1.12.0 (Security-Review Karte BEF08998, ADR 0036, einschränkend, Handbuch 1.48.0): höchstens 5 Wiederholungen je Refresh-Token im
    Nachlauffenster, die sechste widerruft wie ein Replay; eine durch Replay beendete Verbindung wird nur 7 Tage ab revoked_at angeboten und
    angenommen (sonst 409 takeover_changed); kein match=name für den Standardnamen MCP Client oder leere Namen; takeover.project_ids enthält
    auch Vollmacht-Projekte, die nicht in der alten Liste standen; die Vollmacht wandert nur für Projekte, die in project_ids bestätigt sind.
    1.13.0 (Karte BEF08998, ADR 0037, additiv, Handbuch 1.49.0): Projektgruppen. GET /oauth/authorize liefert groups[] und im takeover (auch
    in mandate) selection; POST /oauth/consent und PUT /oauth/grants/{id}/projects nehmen optional selection (ohne selection ersetzt die Liste
    eine Regel). Grants (GET /oauth/grants) liefern project_ids als wirksame Menge, dazu explicit_project_ids und selection. MCP loest die
    Auswahl je Aufruf auf; neues lesendes Werkzeug list_project_groups. Bedeutung und Felder: contracts/connections.yaml x-project-selection.
    takeover.explicit_project_ids nennt die ausdruecklich gewaehlten Projekte der alten Verbindung; nur diese und die ausdruecklich
    genannten Vollmacht-Projekte sind vorausgewaehlt. Mit Mandatsregel wird jedes nicht bestaetigte Vollmacht-Projekt ausgeschlossen.
    1.14.0 (Karte 71FD73CF, ADR 0038, additiv, Handbuch 1.50.0, contracts/usage.yaml 1.0.0): neues Werkzeug report_usage (tasks:write), dieselben
    Argumente, Regeln und Antwort wie POST /v1/usage; Projektzuordnung nur für Projekte im Grant. Keine neuen Scopes.
servers:
  - url: http://localhost:28080
paths:
  /.well-known/oauth-authorization-server:
    get:
      responses:
        '200':
          description: RFC-8414-Metadaten mit Registrierung, S256 und öffentlichen Clients.
  /.well-known/oauth-protected-resource/mcp:
    get:
      responses:
        '200':
          description: RFC-9728-Metadaten; resource ist exakt OAUTH_ISSUER plus /mcp.
  /.well-known/oauth-protected-resource:
    get:
      responses:
        '200':
          description: Alias der Resource-Metadaten.
  /oauth/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: {type: string, maxLength: 200}
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: {type: string, format: uri}
                token_endpoint_auth_method: {const: none}
                grant_types:
                  type: array
                  items: {enum: [authorization_code, refresh_token]}
                response_types:
                  type: array
                  items: {const: code}
      responses:
        '201':
          description: RFC-7591-Client mit client_id, Name, Redirects und unterstützten Grant-Typen.
        '400': {description: Ungültige Clientmetadaten.}
  /oauth/authorize:
    get:
      security: [{userSession: []}]
      parameters:
        - {in: query, name: response_type, required: true, schema: {const: code}}
        - {in: query, name: client_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: redirect_uri, required: true, schema: {type: string, format: uri}}
        - {in: query, name: scope, required: true, schema: {type: string}}
        - {in: query, name: state, schema: {type: string}}
        - {in: query, name: resource, required: true, schema: {type: string, format: uri}}
        - {in: query, name: code_challenge, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
        - {in: query, name: code_challenge_method, required: true, schema: {const: S256}}
      responses:
        '200':
          description: >-
            consent_token (5 Minuten, einmalig), client_name, default_name (Vorschlag für den Namen der Verbindung), client_id, redirect_uri,
            scopes und projects als ProjectDTO-Liste. Consent-Client muss Aktionen und
            Redirect-Ziel anzeigen und explizite Projektauswahl verlangen.
            Seit 1.11.0 optional takeover {grant_id, name, match: client|name, reason: active|replay, project_ids[], mandate: null |
            {project_ids[], project_names[]}}: genau eine frühere Verbindung derselben Person kann übernommen werden; projects enthält dann auch
            ihre freigegebenen (geteilten) Projekte. takeover_ambiguous=true statt takeover, wenn mehrere passen. match=name: neu registrierter
            Client mit gleichem Namen, nur zwischen Loopback-Redirects und nur für eine durch Replay-Erkennung beendete Verbindung (seit 1.12.0
            nicht für den Standardnamen MCP Client oder leere Namen). Seit 1.12.0: Replay-Verbindungen nur bis 7 Tage nach revoked_at; project_ids
            umfasst auch Vollmacht-Projekte außerhalb der alten Liste. Der
            Consent-Client muss Quelle, Vollmacht und match=name vor der Zustimmung deutlich anzeigen.
        '400': {description: Ungültige Anfrage; keine Weiterleitung bei ungültigem Redirect.}
        '401': {description: Bestehender Benutzerlogin erforderlich.}
  /oauth/consent:
    post:
      security: [{userSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_token, project_ids, approve]
              properties:
                consent_token: {type: string}
                approve: {type: boolean}
                connection_name: {type: string, maxLength: 80, description: 'Name der Verbindung; leer = Clientname; ungültig = 400 invalid_name.'}
                takeover_grant_id: {type: string, format: uuid, description: 'Seit 1.11.0: die angebotene Verbindung (takeover.grant_id), deren Projekte und Vollmacht übernommen werden; ohne das Feld wird nichts übernommen. Die alte Verbindung wird beendet (revoked_reason superseded). project_ids bleibt die verbindliche Projektliste; die Vollmacht wandert nur für Projekte, die auch in project_ids stehen (seit 1.12.0 auch für Vollmacht-Projekte außerhalb der alten Liste).'}
                selection: {type: object, description: 'Seit 1.13.0, optional: Regel der neuen Verbindung (connections.yaml x-project-selection); nur eigene Gruppen (sonst 404).'}
                project_ids:
                  type: array
                  items: {type: string, format: uuid}
      responses:
        '200':
          description: >-
            redirect_uri enthält code und unveränderten state oder error=access_denied.
            Aufrufender Browserclient führt Navigation aus. Zustimmung benötigt mindestens
            ein aktuell erlaubtes Projekt. Keine automatische Unterprojektfreigabe.
        '400': {description: Abgelaufener oder bereits verbrauchter Consent; fehlende Auswahl.}
        '404': {description: Fremdes Projekt oder fremder Consent.}
        '409': {description: 'takeover_changed: die genannte Verbindung ist nicht (mehr) die angebotene und übernehmbare. Nichts wird angelegt, der Consent-Token bleibt unverbraucht.'}
  /oauth/token:
    post:
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/TokenRequest'}
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: >-
            access_token, refresh_token, token_type=Bearer, expires_in=900, scope.
            Cache-Control no-store. Refresh rotiert mit neuer 30-Tage-Frist. Seit 1.11.0: das verbrauchte Refresh-Token darf 300 s ab seiner
            ersten Benutzung erneut kommen (gleicher Client, nicht abgelaufen, Verbindung aktiv, kein Nachfolger benutzt) und liefert ein
            weiteres Paar; die erste Benutzung eines Nachfolgers entwertet dessen Geschwister. Seit 1.12.0 höchstens 5 Wiederholungen je Token; die sechste gilt als Replay.
        '400':
          description: invalid_grant; Replay verbrauchter Codes und Refresh-Tokens (außerhalb des Nachlauffensters) widerruft den Grant (revoked_reason replay).
  /oauth/grants:
    get:
      security: [{userSession: []}]
      responses:
        '200':
          description: Eigene Grants mit id, client_id, client_name (bei der Registrierung angegeben, leer wenn unbekannt), name (Name der Verbindung, Standard Clientname), last_used_at (letzte MCP-Nutzung, höchstens alle 5 Minuten geschrieben, sonst null), scopes, project_ids, revoked und revoked_reason (person|replay|superseded|account_locked, null wenn aktiv oder Ursache unbekannt).
  /oauth/grants/{id}:
    patch:
      security: [{userSession: []}]
      summary: Verbindung umbenennen
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 80}}}
      responses:
        '200': {description: Der Grant im Format von GET /oauth/grants.}
        '400': {description: invalid_name (leer, über 80 Zeichen oder Steuerzeichen).}
        '404': {description: Fremder oder unbekannter Grant.}
    delete:
      security: [{userSession: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: 'Grant und damit alle zugehörigen Tokens widerrufen (revoked_reason person). Auch auf bereits widerrufene Grants: danach nie mehr übernehmbar.'}
        '404': {description: Fremder oder unbekannter Grant.}
  /oauth/grants/{id}/projects:
    put:
      security: [{userSession: []}]
      summary: Projekte einer bestehenden Verbindung nachträglich ändern (berechtigen und entrechtigen)
      description: >-
        Ersetzt die Projektliste des Grants. Wirkt sofort, weil MCP-Aufrufe den Grant bei jedem Request lesen.
        Neu hinzugefügte Projekte müssen für das Konto zugänglich sein (sonst 404); Entfernen ist immer möglich.
        Eine leere Liste ist nur mit dem Scope projects:write erlaubt (sonst 400 projects_required).
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [project_ids], properties: {project_ids: {type: array, items: {type: string, format: uuid}}, selection: {type: object, description: 'Seit 1.13.0, optional: connections.yaml x-project-selection. Leere project_ids sind mit Gruppe oder mode all_except erlaubt.'}}}
      responses:
        '200': {description: Der Grant im Format von GET /oauth/grants.}
        '400': {description: projects_required}
        '404': {description: Fremder Grant oder nicht zugängliches Projekt.}
        '409': {description: grant_revoked}
  /mcp:
    post:
      security: [{oauthBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: {const: '2.0'}
                id: {type: [string, number]}
                method: {type: string}
                params: {type: object}
      responses:
        '200':
          description: >-
            JSON-RPC initialize, ping, tools/list oder tools/call. Tool-Ergebnisse als
            Text-Content mit JSON; Fachfehler mit isError=true. Methodenfehler -32601,
            ungültige Requests -32600, Parsefehler -32700, unbekannte Tools -32602.
        '202': {description: Notification akzeptiert, leerer Body.}
        '400': {description: Nicht unterstützter Versionsheader.}
        '401': {description: Fehlendes oder ungültiges OAuth-Token; WWW-Authenticate enthält resource_metadata.}
        '403': {description: Ungültiger Origin.}
    get:
      responses:
        '405': {description: Kein SSE-Stream angeboten.}
components:
  securitySchemes:
    userSession: {type: http, scheme: bearer, description: Bestehende Login-Session; alternativ SameSite-Sessioncookie mit JSON-/Origin-Prüfung.}
    oauthBearer: {type: http, scheme: bearer, description: Ausschließlich an /mcp gebundenes OAuth-Access-Token.}
  schemas:
    TokenRequest:
      type: object
      required: [grant_type, client_id, resource]
      properties:
        grant_type: {enum: [authorization_code, refresh_token]}
        client_id: {type: string, format: uuid}
        resource: {type: string, format: uri}
        code: {type: string}
        redirect_uri: {type: string, format: uri}
        code_verifier: {type: string, minLength: 43, maxLength: 128}
        refresh_token: {type: string}
        scope: {type: string, description: Beim Refresh nur unverändert zulässig.}
x-mcp-tools:
  list_projects: {scope: 'projects:read', arguments: {}, result: ProjectDTO-Liste explizit freigegebener Projekte}
  update_project: {scope: 'projects:write', required: [projectID, version], arguments: {projectID: UUID, version: integer, name: 'string 1-200', description: 'string bis 10000, leer/null löscht', color: '#RRGGBB'}, result: '{id, name, description, color, version, parentID}; Fehler version_conflict, invalid_name, not_found (außerhalb des Grants), Rolle Verwalten wie PATCH /v1/projects/{id}'}
  list_tasks: {scope: 'tasks:read', required: [projectID], arguments: {projectID: UUID, overdue: boolean, orphaned: boolean}, result: TaskDTO-Liste mit planning, notes: 'overdue=true: sichtbare nicht erledigte Aufgaben mit planning.dueAt vor Serverzeit; false/fehlend ungefiltert. orphaned=true|false (additiv): nur in_progress-Aufgaben mit/ohne verwaisten Anspruch (kein Lebenszeichen > 24 h), TaskDTO.orphaned gesetzt; fehlend ungefiltert.'}
  get_task: {scope: 'tasks:read', required: [id], arguments: {id: UUID}, result: TaskDTO}
  create_task: {scope: 'tasks:write', required: [projectID, title], arguments: {projectID: UUID, title: string, description: string, columnID: UUID, dueDate: 'ISO 8601 oder YYYY-MM-DD', priority: 'integer 0-3'}, result: TaskDTO, notes: 'Wie POST /v1/tasks (PlanningOperations): Aktivität, Spalte; dueDate/priority über PlanningService.'}
  update_task: {scope: 'tasks:write', required: [id, version], arguments: {id: UUID, version: integer, title: string, description: string, status: 'open|in_progress|in_review|done', projectID: UUID}, result: TaskDTO}
  list_comments: {scope: 'tasks:read', required: [taskID], arguments: {taskID: UUID, questionID: UUID, reviewID: UUID, thread: 'task', authorKind: 'person|agent', since: 'ISO 8601'}, result: 'CommentDTO-Liste (wie GET /v1/tasks/{id}/comments, zusaetzlich Filter authorKind und since); Upload-Eintraege haben kind=attachment und attachments[{id,filename,mediaType,size}]; Anhaenge ohne Chat-Eintrag ergeben am Ende einen Eintrag kind=attachments_note'}
  add_comment: {scope: 'comments:write', required: [taskID, body], arguments: {taskID: UUID, body: 'string, getrimmt, 1-10000 Zeichen', questionID: UUID, reviewID: UUID, agentName: 'string, 1-100 Zeichen', idempotencyKey: 'string, 1-200 ASCII-Zeichen ohne Leerzeichen'}, result: CommentDTO, notes: 'Gleicher Dienst wie POST /v1/tasks/{id}/comments (Rolle comment live geprüft, Idempotenz, Aktivität). Aktivität nennt actorType=Integration mit der Grant-ID; Autor bleibt der Benutzer.'}
  get_progress: {scope: 'agents:read', required: [taskID], arguments: {taskID: UUID}, result: 'Liste {job: AgentJobDTO, runs: [{id, generation, leaseUntil, endedAt, checkpoint: {contextRevision, sessionReference, nextStep}}]}', notes: 'Nur lesend. Nur Projekteigentümer (wie GET /v1/agents/jobs/{id}); Bearbeiter erhalten einen Fehler. Schreiben von Fortschritt/Checkpoints bleibt der Runner-API mit Geräte-Token und Generationsprüfung vorbehalten.'}
  list_attachments: {scope: 'attachments:read', required: [taskID], arguments: {taskID: UUID}, result: AttachmentDTO-Liste, notes: 'Nur Metadaten abgeschlossener Anhänge; keine Dateiinhalte, kein Objektschlüssel.'}
  get_attachment_download: {scope: 'attachments:read', required: [id], arguments: {id: UUID}, result: '{id, filename, mediaType, size, url, expiresAt}', notes: 'Klasse A. Signierte URL /v1/attachments/{id}/download?exp&sig, 5 Minuten, genau dieser Anhang, nur GET, ohne Sitzung. Nicht auf dem Board veroeffentlichen. Siehe docs/MCP-PARITAET.md, Anhaenge fuer Agenten.'}
  get_attachment: {scope: 'attachments:read', required: [id], arguments: {id: UUID}, result: AttachmentDTO, notes: 'Nur Metadaten; ausstehende, fremde und unbekannte Anhänge sind not_found.'}
  move_project: {scope: 'projects:write', required: [projectID, version, parentID], arguments: {projectID: UUID, version: integer, parentID: 'UUID oder null'}, result: '{id, name, version, parentID}; Fehler version_conflict, project_cycle, not_found'}
  set_project_position: {scope: 'projects:write', required: [projectID, afterProjectID], arguments: {projectID: UUID, afterProjectID: 'UUID oder null'}, result: '{id, version, position}'}
  update_criterion: {scope: 'tasks:write', required: [criterionID, text], arguments: {criterionID: UUID, text: 'string 1-2000', version: integer}, result: CriterionDTO}
  delete_criterion: {scope: 'tasks:write', required: [criterionID], arguments: {criterionID: UUID, version: integer}, result: 'Bestätigungsanfrage (confirmation_required), Klasse C'}
  delete_column: {scope: 'tasks:write', required: [id], arguments: {id: UUID, version: integer, moveTo: 'UUID oder none'}, result: 'Bestätigungsanfrage (confirmation_required), Klasse C'}

  get_task_planning: {scope: 'tasks:read', required: [taskID], result: PlanningTaskDTO}
  update_task_planning: {scope: 'tasks:write', required: [taskID], optional: [version, dueDate, dueTime, dueAt, plannedAt, plannedMinutes, plannedAllDay, priority, recurrence, reminders], result: PlanningTaskDTO}
  list_schedule: {scope: 'tasks:read', required: [from, to], optional: [projectID, limit], result: ScheduleResponse, note: 'Fenster höchstens 62 Tage, limit höchstens 500, nur Projekte im Grant'}
  list_planned_tasks: {scope: 'tasks:read', required: [view], optional: [projectID, limit], views: [today, upcoming, up_next]}
  set_dependencies: {scope: 'tasks:write', class: B, required: [taskID, blockedBy]}
  list_dependencies: {scope: 'tasks:read', required: [taskID], optional: [limit]}
  remove_dependency: {scope: 'tasks:write', class: B, required: [taskID, otherTaskID]}
  list_milestones: {scope: 'tasks:read', required: [projectID], optional: [limit]}
  create_milestone: {scope: 'tasks:write', required: [projectID, title], optional: [dueDate]}
  assign_milestone: {scope: 'tasks:write', required: [taskID, milestoneID]}
  unassign_milestone: {scope: 'tasks:write', required: [taskID, milestoneID]}
  delete_milestone: {scope: 'tasks:write', class: C, required: [milestoneID], result: confirmation_required}

  update_comment: {scope: 'comments:write', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: taskID, commentID, version, body; Löschungen nur als Bestätigungsanfrage.'}
  delete_comment: {scope: 'comments:write', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: taskID, commentID, version?; Löschungen nur als Bestätigungsanfrage.'}
  list_project_comments: {scope: 'projects:read', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: projectID, limit?; Löschungen nur als Bestätigungsanfrage.'}
  add_project_comment: {scope: 'comments:write', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: projectID, body, idempotencyKey?; Löschungen nur als Bestätigungsanfrage.'}
  update_project_comment: {scope: 'comments:write', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: projectID, commentID, version, body; Löschungen nur als Bestätigungsanfrage.'}
  delete_project_comment: {scope: 'comments:write', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: projectID, commentID, version?; Löschungen nur als Bestätigungsanfrage.'}
  list_activity: {scope: 'tasks:read', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: projectID?, limit?, before?; Löschungen nur als Bestätigungsanfrage.'}
  read_attachment: {scope: 'attachments:read', notes: 'Siehe docs/MCP-PARITAET.md, Stapel 4; Argumente: id, preview?; Vorschau nur bis 45000 Byte, sonst previewOmitted=preview_unavailable mit hint; Löschungen nur als Bestätigungsanfrage.'}
