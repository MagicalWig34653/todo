openapi: 3.0.3
info:
  title: Todolino Sync
  version: 1.3.0
  description: 'Änderungsfeed und idempotente Client-Mutationen für Projekte und Aufgaben (ADR 0009). Der Cursor ist
    ein undurchsichtiger Wert (Format "c<Zahl>"), der eine lückenlose, in Commit-Reihenfolge vergebene Sequenz
    im Änderungsprotokoll bezeichnet. Cursor "c0" liefert den vollständigen sichtbaren Stand. Jede Änderung wird nach
    denselben Rechten wie die REST-Lesepfade gefiltert (ProjectAccess/SharingAccess); Nicht-Sichtbares fehlt
    ohne Fehler. Löschungen erscheinen als Tombstones, aber nur für Konten, die das Objekt zum Löschzeitpunkt lesen
    konnten. Sichtbarkeitsänderungen durch Freigaben, Teamannahme/-entzug, Eigentum, Vererbung und Verschiebungen
    erzeugen ebenfalls Upserts für gewonnenen Zugriff (inklusive Altbestand) bzw. Tombstones für verlorenen Zugriff.
    Alternative Rechte bleiben wirksam. Entzug-Tombstones gehen nur an betroffene Konten und werden bei inzwischen
    wieder lesbaren Objekten unterdrückt; erneute Freigabe erzeugt neue Upserts. Auch geänderte redigierte Elternreferenzen
    werden aktualisiert. Clients wenden Änderungen in Sequenzreihenfolge an; kein Resync ab c0 nach Rechtewechsel nötig.
    Upserts können auch unverändert berechtigten Konten erneut geliefert werden. Mutationen verwenden dieselben Operationen und Rechteprüfungen wie die REST-Routen (Fremdes 404, zu
    geringe Rolle 403, Versionskonflikt 409). Migration: CreateSyncSchema (legt Protokolltabellen an und füllt
    bestehende Projekte/Aufgaben als Upserts nach); explizit vor Serverstart ausführen.
    1.2.0: Mutationstypen project.position, task.move_column, column.create/update/delete (Spalten-IDs wählt der Client;
    Rechte wie REST: edit); Projekte tragen description/color/createdAt und die Betrachter-Felder position/isFavorite/
    favoritePosition (Änderungen daran erzeugen ein Projekt-Upsert; der Feed liefert jedem Leser seinen eigenen Stand, siehe project-state.yaml).
    1.3.0 (ADR 0019): Aufbewahrung. Tombstones, ersetzte Upserts und gespeicherte Mutationsergebnisse werden nach
    SYNC_RETENTION_DAYS (Standard 90) gelöscht. Ein Cursor, der unter dem Aufbewahrungsboden liegt, ergibt 410 cursor_expired:
    der Client verwirft seinen lokalen Cache für dieses Konto und beginnt bei c0 (liefert den vollständigen sichtbaren Stand;
    der jeweils neueste Upsert lebender Objekte bleibt erhalten). c0 und Cursor ab dem Boden bleiben gültig. Gelöschte IDs sind
    nur innerhalb der Aufbewahrungsfrist durch id_deleted gesperrt. Wird ein Konto gelöscht (App delete-account), erhalten die
    übrigen Konten Tombstones für alles, was sie dadurch nicht mehr sehen.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/sync/changes:
    get:
      operationId: listSyncChanges
      summary: Änderungen seit einem Cursor
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          default: c0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: Seite von Änderungen; der neue Cursor ist beim nächsten Aufruf zu verwenden, solange hasMore wahr ist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChanges'
        '400':
          description: Ungültiger Cursor (invalid_cursor)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cursor liegt hinter dem Protokollende (cursor_ahead, z. B. nach Wiederherstellung); Client startet bei c0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Cursor liegt unter dem Aufbewahrungsboden (cursor_expired); Tombstones könnten fehlen. Client verwirft den lokalen Cache des Kontos und holt den Stand neu ab c0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sync/mutations:
    post:
      operationId: applySyncMutation
      summary: Client-Mutation idempotent anwenden
      description: 'Der Schlüssel (Konto, mutationID) macht Wiederholungen sicher: gleiche Anfrage liefert den gespeicherten
        Status und Body erneut (Header Idempotent-Replay: true), gleiche mutationID mit anderem Inhalt ergibt 409
        mutation_id_reused. Fehlgeschlagene Mutationen werden nicht gespeichert. Neue IDs wählt der Client; bereits
        vergebene oder gelöschte IDs ergeben 409 (id_exists, id_deleted).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncMutationRequest'
      responses:
        '200':
          description: Aktualisiert oder gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMutationResult'
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMutationResult'
        '400':
          description: Ungültige Eingabe, unbekannter Typ oder fehlende Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sichtbar, aber Rolle reicht nicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Objekt fehlt oder ist fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict, mutation_id_reused, id_exists, id_deleted, project_cycle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: todo_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: boolean
        reason:
          type: string
    Project:
      type: object
      required: [id, name, version]
      properties:
        id: {type: string, format: uuid}
        parentID: {type: string, format: uuid, nullable: true}
        name: {type: string}
        version: {type: integer}
        description: {type: string}
        color: {type: string}
        createdAt: {type: string, format: date-time}
        position: {type: integer, description: 'Eigene Geschwisterreihenfolge des Betrachters (ADR 0012)'}
        isFavorite: {type: boolean}
        favoritePosition: {type: integer}
    Column:
      type: object
      required: [id, projectID, name, isDone, position, version]
      properties:
        id: {type: string, format: uuid}
        projectID: {type: string, format: uuid}
        name: {type: string}
        color: {type: string, nullable: true}
        isDone: {type: boolean}
        position: {type: integer}
        version: {type: integer}
    Task:
      type: object
      required: [id, projectID, title, description, status, version]
      properties:
        id: {type: string, format: uuid}
        projectID: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string, enum: [open, in_progress, in_review, done]}
        version: {type: integer}
    SyncChange:
      type: object
      required: [seq, entityType, entityID, kind]
      properties:
        seq: {type: integer}
        entityType: {type: string, enum: [project, task]}
        entityID: {type: string, format: uuid}
        kind:
          type: string
          enum: [upsert, delete]
          description: 'delete entfernt lokale Daten bei physischer Löschung oder Zugriffsverlust; enthält keine Projekt-/Aufgaben-Payload. Ein Zugriffsverlust löscht das Objekt serverseitig nicht.'
        project: {$ref: '#/components/schemas/Project'}
        task: {$ref: '#/components/schemas/Task'}
    SyncChanges:
      type: object
      required: [changes, cursor, hasMore]
      properties:
        changes:
          type: array
          items: {$ref: '#/components/schemas/SyncChange'}
        cursor: {type: string}
        hasMore: {type: boolean}
    SyncMutationRequest:
      type: object
      required: [mutationID, type, id]
      properties:
        mutationID: {type: string, format: uuid}
        type:
          type: string
          enum: [project.create, project.update, project.delete, project.position, task.create, task.update, task.delete,
            task.move_column, column.create, column.update, column.delete]
        id: {type: string, format: uuid}
        version: {type: integer, description: 'Pflicht bei update, optional bei delete (dann Versionsprüfung)'}
        name: {type: string}
        parentID: {type: string, format: uuid}
        moveToRoot: {type: boolean}
        projectID: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        status: {type: string}
        color: {type: string, description: 'project.create/update und column.create/update: #RRGGBB (leer löscht). Beschreibung eines Projekts: Feld description (leer löscht).'}
        isDone: {type: boolean, description: 'column.create/update'}
        index: {type: integer, minimum: 0, description: 'column.create/update, task.move_column, project.position: 0-basierte Zielposition'}
        moveTo: {type: string, description: 'column.delete: "none" oder Spalten-UUID; fehlt = erste verbleibende Spalte'}
        columnID: {type: string, format: uuid, description: 'task.move_column: Zielspalte; fehlt = Ohne Spalte'}
    SyncMutationResult:
      type: object
      required: [mutationID, type, id, deleted, cursor]
      properties:
        mutationID: {type: string, format: uuid}
        type: {type: string}
        id: {type: string, format: uuid}
        deleted: {type: boolean}
        project: {$ref: '#/components/schemas/Project'}
        task: {$ref: '#/components/schemas/Task'}
        column: {$ref: '#/components/schemas/Column', description: 'column.create/update'}
        cursor: {type: string}
