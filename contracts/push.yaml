openapi: 3.1.0
info:
  title: Todolino – Push-Benachrichtigungen (APNs)
  version: 1.1.0
  description: 'ADR 0021, Betrieb: docs/PUSH-EINRICHTUNG.md. Geräte-Registrierung und Einstellungen je Konto; Sitzung oder Bearer nötig,
    jedes Konto sieht und ändert nur seine eigenen Geräte. Geräte-Tokens werden nie ausgegeben und nie geloggt. Registrierung ist auch
    möglich, wenn der Server Push noch nicht aktiviert hat (APNS_ENABLED=false); bei aktiviertem Push muss bundleId zu APNS_TOPIC passen.
    Zustellung: serverseitiger Worker (Outbox), Kategorien reminders, agent_questions, agent_reviews, comments (assignments vorbereitet,
    ohne Auslöser). Inhalt generisch, solange showContent false ist. Nachrichten tragen im userInfo auf oberster Ebene kind
    (reminder|question|review|comment|test), taskID, projectID, subjectID (Frage-/Review-/Kommentar-ID) und aps.thread-id = projectID,
    aps.category TODO_REMINDER|TODO_QUESTION|TODO_REVIEW|TODO_COMMENT, mutable-content 1 (Notification Service Extension möglich), optional aps.badge
    (offene Fragen plus ausstehende Reviews, wenn badge true). Kein Sync-Feed. Ob der Server Push anbietet: GET /v1/push/status (angemeldet) {enabled}; Umgebung und Details nur für Administratoren in GET /v1/admin/health (push {enabled, environment}), nie anonym in /health/ready.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/push/status:
    get:
      operationId: getPushServerStatus
      summary: Bietet der Server Push an?
      responses:
        '200': {description: Erfolgreich, content: {application/json: {schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}}}}
        '401': {description: Nicht angemeldet}
  /v1/push/devices:
    post:
      operationId: registerPushDevice
      summary: Gerät registrieren oder aktualisieren (idempotent je Token)
      description: 'Dasselbe Token ergibt dieselbe Geräte-ID (201 beim ersten Mal, danach 200) und setzt last_seen zurück und reaktiviert ein
        widerrufenes Gerät. Meldet ein anderes Konto dasselbe Token, wird es diesem Konto zugeordnet. Höchstens 20 aktive Geräte je Konto
        (das am längsten ungesehene wird widerrufen). Sollte bei jedem App-Start und bei neuem Token aufgerufen werden.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterPushDevice'}
      responses:
        '200': {description: Bekanntes Token aktualisiert, content: {application/json: {schema: {$ref: '#/components/schemas/PushDevice'}}}}
        '201': {description: Neu registriert, content: {application/json: {schema: {$ref: '#/components/schemas/PushDevice'}}}}
        '400': {description: 'reason invalid_token, invalid_platform, invalid_environment, invalid_bundle_id, invalid_app_version, invalid_locale'}
        '401': {description: Nicht angemeldet}
    get:
      operationId: listPushDevices
      summary: Eigene aktive Geräte (ohne Token)
      responses:
        '200': {description: Erfolgreich, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PushDevice'}}}}}
        '401': {description: Nicht angemeldet}
  /v1/push/devices/{id}:
    delete:
      operationId: revokePushDevice
      summary: Gerät widerrufen (z. B. bei Abmeldung)
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Widerrufen}
        '404': {description: Unbekannt, fremd oder bereits widerrufen}
  /v1/push/test:
    post:
      operationId: sendPushTest
      summary: Generische Test-Benachrichtigung an die eigenen aktiven Geräte
      description: 'Nutzt denselben Sender wie der Worker und das CLI-Kommando push-test, aber nur für Geräte des angemeldeten Kontos.
        Die Nachricht ist generisch (kein Aufgabeninhalt). Antwort je Gerät: sent, failed (mit APNs-Grund oder Fehlerklasse wie
        network) oder revoked (Token tot, Gerät wurde widerrufen). Nie ein Token. Ohne aktive Geräte: 200 mit leerer Liste.
        Begrenzung: eine Anfrage je Konto und 10 Sekunden.'
      responses:
        '200': {description: Ergebnis je Gerät, content: {application/json: {schema: {$ref: '#/components/schemas/PushTestResult'}}}}
        '401': {description: Nicht angemeldet}
        '409': {description: 'reason push_disabled (APNS_ENABLED ist nicht true)'}
        '429': {description: 'reason push_test_rate_limited, Retry-After 10'}
  /v1/me/push-prefs:
    get:
      operationId: getPushPrefs
      summary: Push-Einstellungen des Kontos (Standardwerte, wenn nichts gespeichert ist)
      responses:
        '200': {description: Erfolgreich, content: {application/json: {schema: {$ref: '#/components/schemas/PushPrefs'}}}}
    post:
      operationId: setPushPrefs
      summary: Einstellungen teilweise ändern (nur gesendete Felder)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePushPrefs'}
      responses:
        '200': {description: Neuer Stand, content: {application/json: {schema: {$ref: '#/components/schemas/PushPrefs'}}}}
        '400': {description: 'invalid_category, invalid_daily_brief_hour'}
    put:
      operationId: putPushPrefs
      summary: Wie POST (Alias)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdatePushPrefs'}
      responses:
        '200': {description: Neuer Stand, content: {application/json: {schema: {$ref: '#/components/schemas/PushPrefs'}}}}
        '400': {description: 'invalid_category, invalid_daily_brief_hour'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: todo_session}
  schemas:
    RegisterPushDevice:
      type: object
      required: [token, platform, bundleId]
      properties:
        token: {type: string, description: 'APNs-Gerätetoken als Hex-String (32 bis 200 Zeichen), Groß-/Kleinschreibung egal'}
        platform: {type: string, enum: [ios, macos]}
        environment: {type: string, enum: [sandbox, production], description: 'Debug-Builds (aps-environment development): sandbox; TestFlight/App Store: production. Fehlt es, gilt APNS_ENVIRONMENT des Servers.'}
        bundleId: {type: string, description: 'apns-topic, z. B. de.linolaske.todo'}
        appVersion: {type: string, maxLength: 40}
        locale: {type: string, maxLength: 35, description: 'z. B. de-DE; de* ergibt deutsche Texte, sonst englische'}
    PushDevice:
      type: object
      required: [id, platform, environment, bundleId, lastSeenAt]
      properties:
        id: {type: string, format: uuid}
        platform: {type: string, enum: [ios, macos]}
        environment: {type: string, enum: [sandbox, production]}
        bundleId: {type: string}
        appVersion: {type: [string, 'null']}
        locale: {type: [string, 'null']}
        createdAt: {type: [string, 'null'], format: date-time}
        lastSeenAt: {type: string, format: date-time}
    PushTestResult:
      type: object
      required: [devices, sent]
      properties:
        sent: {type: integer, description: Anzahl der Geräte mit result sent}
        devices:
          type: array
          items:
            type: object
            required: [id, platform, environment, result]
            properties:
              id: {type: string, format: uuid}
              platform: {type: string, enum: [ios, macos]}
              environment: {type: string, enum: [sandbox, production]}
              result: {type: string, enum: [sent, failed, revoked]}
              detail: {type: [string, 'null'], description: 'APNs-Grund (z. B. BadDeviceToken, InvalidProviderToken) oder Fehlerklasse (network)'}
    PushPrefs:
      type: object
      required: [categories, showContent, badge, dailyBriefHour]
      properties:
        categories:
          type: object
          description: 'Alle Schlüssel sind immer vorhanden. Standard: reminders, agent_questions, agent_reviews, confirmations true; assignments, comments, daily_brief false.'
          properties:
            reminders: {type: boolean}
            agent_questions: {type: boolean}
            agent_reviews: {type: boolean}
            assignments: {type: boolean}
            comments: {type: boolean}
            confirmations: {type: boolean}
            daily_brief: {type: boolean, description: 'Additiv 1.1.0: täglicher Tagesbericht (Zeile mit Zählern, höchstens 200 Zeichen, nie Titel), Standard aus. kind daily_brief, aps.category TODO_DAILY_BRIEF.'}
        dailyBriefHour: {type: integer, minimum: 0, maximum: 23, description: 'Additiv 1.1.0: UTC-Stunde, ab der der Tagesbericht gesendet wird (Standard 8); höchstens einmal je Konto und UTC-Tag, nur innerhalb von 6 Stunden nach dieser Stunde.'}
        showContent: {type: boolean, description: 'false (Standard): generische Texte. true: Aufgabentitel und bei Fragen/Reviews der Text (gekürzt) in der Benachrichtigung.'}
        badge: {type: boolean, description: 'Standard true: aps.badge = offene Fragen + ausstehende Reviews.'}
    UpdatePushPrefs:
      type: object
      properties:
        categories:
          type: object
          additionalProperties: {type: boolean}
        showContent: {type: boolean}
        badge: {type: boolean}
        dailyBriefHour: {type: integer, minimum: 0, maximum: 23}
