openapi: 3.0.3
info:
  title: Todolino Deploy-Ziele (SFTP, FTP, FTPS) – Phase 1a bis 2b (Zielserver nur lesen)
  version: 1.2.0
  description: |
    Karte 354ADE12, ADR 0039, Konzept im Orchestrator docs/konzept-deploy-sftp.md (Abschnitt 8 vor 1–7).

    Phase 1a: Ziele mit verschlüsselten Zugangsdaten, Regeln (Ein-/Ausschlüsse, Vorgabe-Ausschlüsse, Pfadzuordnung), Verbindungstest
    und Abgleich nur lesen. Kein Hochladen, kein Holen, kein Löschen auf dem Server.

    Rechte: Ziele anlegen, ändern, löschen und den SFTP-Host-Schlüssel bestätigen nur Personen (Sitzung; OAuth-Zugriffstoken = 401)
    mit der Rolle manage am Projekt. Lesen: read. Verbindungstest und Abgleich: edit. Agenten nutzen MCP (list_deploy_targets,
    test_deploy_target, compare_deploy_target, Scope projects:read, Projekt im Grant) und sehen nur id, name, stage, protocol,
    hostKeyConfirmed und Ergebnisse, nie Host, Port, Pfad, Benutzer oder Zugangsdaten.

    Zugangsdaten: password oder privateKey (+ optional privateKeyPassphrase) werden mit AES-256-GCM (SETTINGS_ENCRYPTION_KEY,
    Zusatzdaten todolino.deploy.v1:<Ziel-ID>:secret) gespeichert und nie zurückgegeben. Ohne Schlüssel 409 encryption_key_missing.
    Host, Port, Protokoll und Benutzer sind an die gespeicherten Zugangsdaten gebunden: wer sie ändert, muss im selben Aufruf ein
    neues password oder einen neuen privateKey senden (400 deploy_credentials_required). Ein neuer Host, Port oder ein anderes
    Protokoll setzt die Host-Schlüssel-Bestätigung zurück.

    SFTP-Host-Schlüssel: Vor der Bestätigung meldet sich der Server nirgends an. POST .../test liefert dann code
    deploy_host_key_unconfirmed und offeredHostKey (Typ, SHA256-Fingerabdruck); die Person bestätigt mit POST .../host-key. Der Server
    liest den Schlüssel dabei erneut und speichert ihn nur, wenn der Fingerabdruck noch stimmt (sonst 409 deploy_host_key_changed).
    Danach wird nur dieser Schlüssel angenommen (deploy_host_key_mismatch).

    FTPS: tlsCertificate (PEM) ist, wenn gesetzt, der einzige Vertrauensanker; sonst gilt das Systemvertrauen.
    Ziel-Host: private und Loopback-Adressen (auch über Namensauflösung) werden abgelehnt (400 deploy_target_blocked), außer der Server
    läuft mit DEPLOY_ALLOW_PRIVATE_HOSTS=1.

    Käfig: basePath ohne `..`, `.` und leere Segmente ("/" = Wurzel, "" = Login-Verzeichnis); Symlinks auf SFTP werden weder gelistet
    noch gelesen; der Server liest nur Pfade unterhalb des Basispfads. FTP/FTPS kennzeichnen Symlinks nicht: dort schützt nur die chroot
    des Servers. SFTP und FTP verbinden zur geprüften Adresse; FTPS über den Namen (Zertifikat).
    Das Geheimnis ist an Protokoll, Host, Port und Benutzer gebunden (sonst deploy_secret_unreadable). null für password bzw.
    privateKey ist nur zusammen mit der jeweils anderen Anmeldung erlaubt (sonst deploy_credentials_required); privateKeyPassphrase
    nur zusammen mit privateKey (sonst deploy_private_key_invalid).

    Regeln (Globs auf Repo-Pfaden): `*` und `?` innerhalb eines Segments, `**` über Segmente; ohne `/` passt das Muster auf den
    Dateinamen in jeder Tiefe, mit `/` ab Repo-Wurzel; ein abschließendes `/` meint ein Verzeichnis. includes leer = alles.
    defaultExcludes (Vorgabe true) schließt zusätzlich aus: **/.git/**, .github/**, .idea/**, .vscode/**, **/node_modules/**,
    **/tests/**, docs/**, .env, .env.*, *.pem, *.key, id_rsa*, id_ed25519*, .DS_Store, .todolino.json, .todolino-deploy.json,
    .claude/**, CLAUDE.md, AGENTS.md, phpunit.xml*. mappings ordnet Repo-Pfade Server-Pfaden (relativ zum Basispfad) zu; der längste
    passende Präfix gewinnt; ohne mappings gilt "" -> "". Repo-Dateien außerhalb jeder Zuordnung gehören nicht zum Ziel.

    Abgleich: Der Aufrufer sendet das Manifest des Repo-Stands (path, size, sha256 je Datei, höchstens 50 000; REST-Body höchstens
    16 MB, sonst 413; 1.0.1, vorher galt die allgemeine Grenze von 256 kB). Die PWA (Phase 1b) bildet das Manifest im Browser aus
    einem gewählten Ordner. Der Server listet den
    Basispfad rekursiv und lädt nur Dateien, deren Status vom Inhalt abhängt (gleiche Größe, oder Server-Datei größer und höchstens
    2 MB, weil sie sich nur in Zeilenenden unterscheiden kann). Status: same (gleich; Textdateien bis 2 MB auch nach CRLF -> LF),
    new (nur im Repo), changed, serverOnly (nur auf dem Server, innerhalb der Zuordnung und nicht ausgeschlossen), unverified (zu groß
    zum Laden, > 64 MB je Datei oder > 256 MB je Lauf). Verbindungsfehler kommen als 200 mit ok=false und code.

    Holen (1.1.0, Phase 2a, ADR 0041): POST .../pull liefert die Dateien, die auf dem Server geändert wurden oder nur dort liegen,
    mit den Zeilenenden des Repos (Manifest-Eintrag `eol`: lf (Vorgabe), crlf, keep; Binärdateien bleiben unberührt), dazu Branch-Name
    `server/<ziel>-JJJJ-MM-TT` (Europe/Berlin) und eine Commit-Nachricht. Dateien mit Geheimnis-Namen (.env*, *.pem, *.key, id_rsa*,
    .htpasswd, .ssh/, .aws/ ...), in .git/.github, mit Geheimnis-Inhalt (Konfigurationsdateien mit Passwort, Schlüssel oder Token,
    private Schlüssel, bekannte Token-Formate, Zugangsdaten in URLs), nach den Ausschlussregeln des Ziels oder über 8 MB werden nie
    geliefert und nur in `findings` genannt (reason secret_name, blocked_path, secret_content, excluded, too_large, unreadable, unverified);
    Namen, Sperr- und Ausschlusspfade werden nicht einmal heruntergeladen. Das Ergebnis ist durch `maxBytes` begrenzt (REST 4 MB,
    MCP 256 kB, höchstens 16 MB; eine Datei geht immer durch), `remaining` nennt die Repo-Pfade für den nächsten Aufruf (`paths`).
    Restrisiko: Der Inhaltsschutz ist eine Heuristik (Zuweisungen in einer Zeile, Konfigurationsdateien bis 2 MiB; Werte über mehrere
    Zeilen, ungewöhnliche Schlüsselnamen in Dateien ohne Konfigurationsnamen werden nicht erkannt). Gehalten wird eher zu viel als zu wenig.
    Symlinks: SFTP listet und liest sie nicht; FTP/FTPS listen sie wie Dateien, deshalb wird vor dem Lesen jedes Verzeichnis auf dem
    Weg mit LIST geprüft (curl) und alles hinter einem Link verworfen. Bei pull entstehen Branch und Commit beim
    Aufrufer (scripts/deploy-pull-apply.py). Auf dem Server wird nichts geändert.

    Pull Request (1.2.0, Phase 2b, ADR 0042, docs/GITHUB-APP-EINRICHTUNG.md): POST .../pull-request legt dieselben Dateien als einen
    Commit auf baseCommit (Commit des Standard-Branches, zu dem das Manifest gehört) in einem NEUEN Branch server/<a-z, 0-9, -> an
    (Vorgabe server/<ziel>-JJJJ-MM-TT, belegt: -2 bis -20) und öffnet einen Pull Request gegen den Standard-Branch, über die GitHub-App
    des Betreibers (GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY[_FILE], GITHUB_APP_REPOSITORIES =
    Projekt-ID=owner/repo). Nie main oder andere Refs (400 deploy_branch_forbidden, vor jedem Aufruf an GitHub oder den Zielserver); kein
    Ref wird verschoben oder gelöscht, nichts gemergt. Nur private Repositorys, nur für das Projekt freigegebene. Nie geschrieben werden
    Pipeline-Dateien (Jenkinsfile, .circleci/ u. a.) und Pfade, an denen im Repository ein Symlink, Submodul oder Datei/Ordner-Konflikt
    steht (blocked_path); Dateien, die im baseCommit schon so sind, fallen weg. Höchstens 500 Dateien, davon 50 Binärdateien je Lauf
    (Rest in remaining); maxBytes Vorgabe 4 MB (REST und MCP). Ohne Konfiguration ok=false deploy_github_not_configured. Schlüssel,
    JWT und Installations-Token der App stehen in keiner Antwort und keinem Log.

    Fehlercodes der Verbindung: deploy_host_key_unconfirmed, deploy_host_key_mismatch, deploy_tls_untrusted, deploy_auth_failed,
    deploy_base_path_missing, deploy_unreachable, deploy_target_blocked, deploy_transport_unavailable (rclone fehlt),
    deploy_secret_unreadable (Schlüssel rotiert), deploy_failed. Antworten und Logs enthalten nie Zugangsdaten oder Ausgaben von rclone.
servers:
  - url: http://localhost:28080
paths:
  /v1/projects/{id}/deploy-targets:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Ziele des Projekts (read)
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/DeployTarget'}}}}}}}
        '404': {description: Projekt unbekannt oder nicht sichtbar}
    post:
      summary: Ziel anlegen (Person, manage)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTargetWrite'}}}}
      responses:
        '201': {description: Angelegt, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTarget'}}}}
        '400': {description: 'deploy_name_invalid, deploy_stage_invalid, deploy_protocol_invalid, deploy_host_invalid, deploy_port_invalid, deploy_base_path_invalid, deploy_username_invalid, deploy_credentials_required, deploy_credentials_ambiguous, deploy_private_key_invalid, deploy_certificate_invalid, deploy_rules_invalid, deploy_target_blocked, deploy_target_limit'}
        '401': {description: Keine Personen-Sitzung}
        '404': {description: Projekt unbekannt oder ohne manage}
        '409': {description: encryption_key_missing}
  /v1/deploy-targets/{targetID}:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Ein Ziel (read)
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTarget'}}}}
    patch:
      summary: Ziel ändern (Person, manage); fehlende Felder bleiben, null bei password/privateKey/privateKeyPassphrase/tlsCertificate entfernt
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTargetWrite'}}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTarget'}}}}
    delete:
      summary: Ziel löschen (Person, manage)
      responses:
        '204': {description: Gelöscht}
  /v1/deploy-targets/{targetID}/host-key:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: SFTP-Host-Schlüssel bestätigen (Person, manage)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [fingerprint], properties: {fingerprint: {type: string, example: 'SHA256:...'}}}}}}
      responses:
        '200': {description: Bestätigt, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTarget'}}}}
        '409': {description: deploy_host_key_changed}
        '502': {description: Host-Schlüssel nicht lesbar (deploy_unreachable, deploy_transport_unavailable)}
  /v1/deploy-targets/{targetID}/test:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Verbindungstest (Person, edit). MCP test_deploy_target liefert dasselbe ohne offeredHostKey.
      responses:
        '200': {description: Ergebnis, content: {application/json: {schema: {$ref: '#/components/schemas/DeployTestResult'}}}}
  /v1/deploy-targets/{targetID}/compare:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Abgleich nur lesen (Person, edit). MCP compare_deploy_target hat dieselben Argumente und dieselbe Antwort.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [files], properties: {files: {type: array, maxItems: 50000, items: {$ref: '#/components/schemas/ManifestEntry'}}}}}}}
      responses:
        '200': {description: Ergebnis, content: {application/json: {schema: {$ref: '#/components/schemas/DeployCompareResult'}}}}
        '400': {description: deploy_manifest_invalid}
  /v1/deploy-targets/{targetID}/pull:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Server-Änderungen holen, nur lesen (Person, edit; Body bis 16 MB). MCP pull_server_changes hat dieselben Argumente und dieselbe Antwort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files: {type: array, maxItems: 50000, items: {$ref: '#/components/schemas/ManifestEntry'}}
                paths: {type: array, maxItems: 5000, items: {type: string}, description: 'nur diese Repo-Pfade (z. B. remaining der letzten Antwort); die Zusammenfassung gilt dann für diese Auswahl'}
                maxBytes: {type: integer, minimum: 1, maximum: 16777216, description: 'Budget der gelieferten Inhalte, REST Vorgabe 4194304, MCP 262144'}
                eol: {type: string, enum: [lf, keep], description: 'Zeilenenden für Dateien ohne Manifest-Eintrag (Vorgabe lf)'}
      responses:
        '200': {description: Ergebnis (Verbindungsfehler als ok=false mit code), content: {application/json: {schema: {$ref: '#/components/schemas/DeployPullResult'}}}}
        '400': {description: 'deploy_manifest_invalid, deploy_pull_invalid'}
        '401': {description: Keine Personen-Sitzung}
        '403': {description: Nur lesen am Projekt}
        '404': {description: Ziel unbekannt oder nicht sichtbar}
  /v1/deploy-targets/{targetID}/pull-request:
    parameters: [{name: targetID, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Pull Request mit den Server-Änderungen öffnen (Person, edit; Body bis 16 MB). MCP open_server_changes_pr hat dieselben Argumente und dieselbe Antwort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, baseCommit]
              properties:
                files: {type: array, maxItems: 50000, items: {$ref: '#/components/schemas/ManifestEntry'}, description: Manifest des Repo-Stands bei baseCommit}
                baseCommit: {type: string, description: 'volle Commit-ID (40 oder 64 Hex) auf dem Standard-Branch'}
                paths: {type: array, maxItems: 5000, items: {type: string}}
                maxBytes: {type: integer, minimum: 1, maximum: 16777216, description: Vorgabe 4194304}
                eol: {type: string, enum: [lf, keep]}
                branch: {type: string, maxLength: 87, pattern: '^server/[a-z0-9][a-z0-9-]*$'}
                repository: {type: string, description: 'owner/repo; nötig, wenn für das Projekt mehrere freigegeben sind'}
      responses:
        '200': {description: Ergebnis (auch Fehler von GitHub oder Zielserver als ok=false mit code), content: {application/json: {schema: {$ref: '#/components/schemas/DeployPublishResult'}}}}
        '400': {description: 'deploy_branch_forbidden, deploy_manifest_invalid, deploy_pull_invalid (auch fehlender oder falscher baseCommit)'}
        '401': {description: Keine Personen-Sitzung}
        '403': {description: Nur lesen am Projekt}
        '404': {description: Ziel unbekannt oder nicht sichtbar}
components:
  schemas:
    DeployPublishResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        code: {type: string, description: 'deploy_github_not_configured, deploy_github_config_invalid, deploy_github_repository_not_allowed, deploy_github_repository_required, deploy_github_repository_public, deploy_github_base_unknown, deploy_pull_nothing, deploy_github_auth_failed, deploy_github_forbidden, deploy_github_not_found, deploy_github_unavailable, deploy_github_failed, deploy_github_branch_exists, deploy_github_pr_failed (branch und commit sind gesetzt) oder ein Fehlercode der Verbindung'}
        repository: {type: string, example: owner/repo}
        branch: {type: string, example: server/kubus-test-2026-11-28}
        baseBranch: {type: string}
        baseCommit: {type: string}
        commit: {type: string}
        pullRequest: {type: object, required: [number, url], properties: {number: {type: integer}, url: {type: string}}}
        summary: {type: object, properties: {changed: {type: integer}, serverOnly: {type: integer}, onlyInRepo: {type: integer}, same: {type: integer}, withheld: {type: integer}, unverified: {type: integer}}}
        files: {type: array, items: {type: object, required: [path, serverPath, status, size, sha256], properties: {path: {type: string}, serverPath: {type: string}, status: {type: string, enum: [changed, serverOnly]}, size: {type: integer}, sha256: {type: string}}}}
        findings: {type: array, items: {type: object, required: [path, serverPath, reason], properties: {path: {type: string}, serverPath: {type: string}, reason: {type: string, enum: [secret_name, blocked_path, secret_content, excluded, too_large, unreadable, unverified]}}}}
        findingsTotal: {type: integer}
        remaining: {type: array, maxItems: 5000, items: {type: string}}
        remainingTotal: {type: integer}
    DeployPullResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        code: {type: string}
        branch: {type: string, example: server/kubus-test-2026-11-27}
        commitMessage: {type: string}
        summary: {type: object, properties: {changed: {type: integer}, serverOnly: {type: integer}, onlyInRepo: {type: integer}, same: {type: integer}, withheld: {type: integer}, unverified: {type: integer}}}
        files:
          type: array
          items:
            type: object
            required: [path, serverPath, status, eol, encoding, content, size, sha256]
            properties:
              path: {type: string, description: Repo-Pfad}
              serverPath: {type: string}
              status: {type: string, enum: [changed, serverOnly]}
              eol: {type: string, enum: [lf, crlf, keep, binary]}
              encoding: {type: string, enum: [utf-8, base64], description: 'base64 bei Binärdateien, ungültigem UTF-8 oder führendem BOM'}
              content: {type: string}
              size: {type: integer}
              sha256: {type: string, description: SHA-256 des gelieferten Inhalts}
        findings:
          type: array
          items:
            type: object
            required: [path, serverPath, reason]
            properties:
              path: {type: string}
              serverPath: {type: string}
              reason: {type: string, enum: [secret_name, blocked_path, secret_content, excluded, too_large, unreadable, unverified]}
        findingsTotal: {type: integer, description: 'höchstens 500 Einträge in findings'}
        remaining: {type: array, maxItems: 5000, items: {type: string}}
        remainingTotal: {type: integer, description: 'Zahl der noch nicht gelieferten Repo-Pfade (remaining nennt höchstens 5000)'}

    Rules:
      type: object
      properties:
        includes: {type: array, items: {type: string}, maxItems: 200}
        excludes: {type: array, items: {type: string}, maxItems: 200}
        mappings: {type: array, maxItems: 50, items: {type: object, required: [local, remote], properties: {local: {type: string}, remote: {type: string}}}}
        defaultExcludes: {type: boolean, default: true}
    DeployTargetWrite:
      type: object
      properties:
        name: {type: string, maxLength: 120}
        stage: {type: string, enum: [test, prod]}
        protocol: {type: string, enum: [sftp, ftp, ftps, ftps-implicit], description: 'ftps = explizites TLS (AUTH TLS), ftps-implicit = Port 990'}
        host: {type: string}
        port: {type: integer, description: 'Vorgabe 22 (sftp), 21 (ftp, ftps), 990 (ftps-implicit)'}
        basePath: {type: string, description: 'relativ zum Login-Verzeichnis oder absolut; ohne ..'}
        username: {type: string}
        password: {type: string, nullable: true, writeOnly: true}
        privateKey: {type: string, nullable: true, writeOnly: true, description: 'nur sftp, PEM/OpenSSH'}
        privateKeyPassphrase: {type: string, nullable: true, writeOnly: true}
        tlsCertificate: {type: string, nullable: true, description: 'PEM, nur ftps'}
        rules: {$ref: '#/components/schemas/Rules'}
    DeployTarget:
      type: object
      required: [id, projectID, name, stage, protocol, host, port, basePath, username, authMethod, hostKey, tlsCertificatePinned, rules, effectiveExcludes, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        projectID: {type: string, format: uuid}
        name: {type: string}
        stage: {type: string}
        protocol: {type: string}
        host: {type: string}
        port: {type: integer}
        basePath: {type: string}
        username: {type: string}
        authMethod: {type: string, enum: [password, key]}
        hostKey: {type: object, required: [confirmed], properties: {confirmed: {type: boolean}, type: {type: string}, fingerprint: {type: string}}}
        tlsCertificatePinned: {type: boolean}
        rules: {$ref: '#/components/schemas/Rules'}
        effectiveExcludes: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DeployTargetSummary:
      type: object
      description: Sicht der Agenten (MCP list_deploy_targets)
      required: [id, name, stage, protocol, hostKeyConfirmed]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        stage: {type: string}
        protocol: {type: string}
        hostKeyConfirmed: {type: boolean}
    DeployTestResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        code: {type: string}
        files: {type: integer}
        offeredHostKey: {type: object, description: 'nur REST, nur solange unbestätigt', properties: {type: {type: string}, fingerprint: {type: string}}}
    ManifestEntry:
      type: object
      required: [path, size, sha256]
      properties:
        path: {type: string, maxLength: 1024}
        size: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        eol: {type: string, enum: [lf, crlf, keep], description: 'nur Holen: Zeilenenden der Datei im Repo (Vorgabe lf); beim Abgleich ignoriert'}
    DeployCompareResult:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        code: {type: string}
        summary: {type: object, properties: {same: {type: integer}, new: {type: integer}, changed: {type: integer}, serverOnly: {type: integer}, unverified: {type: integer}}}
        files:
          type: array
          items:
            type: object
            required: [path, serverPath, status]
            properties:
              path: {type: string}
              serverPath: {type: string}
              status: {type: string, enum: [same, new, changed, serverOnly, unverified]}
              repoSize: {type: integer}
              serverSize: {type: integer}
