        in: query
        schema:
          type: string
        description: Cursor aus der vorigen Antwort; an diese Aufgabe gebunden.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      description: 'Aufsteigend nach unveränderlicher Sequenz je Aufgabe. Neue Ereignisse erscheinen hinter vorhandenen;
        gleiche Zeitstempel beeinflussen die Reihenfolge nicht. Kein Snapshot: später hinzugefügte Ereignisse können
        auf Folgeseiten erscheinen. Ereignisse haben keine Änderungs-/Löschroute.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: todo_session
      description: Schreibzugriffe benötigen JSON und einen erlaubten Origin, falls vorhanden.
  schemas:
    Comment:
      type: object
      required:
      - id
      - taskID
      - authorID
      - body
      - version
      properties:
        id:
          type: string
          format: uuid
        taskID:
          type: string
          format: uuid
        authorID:
          type: string
          format: uuid
        body:
          type: string
        version:
          type: integer
          minimum: 1
    CommentCreate:
      type: object
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
    CommentUpdate:
      type: object
      required:
      - body
      - version
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
        version:
          type: integer
          minimum: 1
    Version:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          minimum: 1
    Criterion:
      type: object
      required:
      - id
      - taskID
      - text
      - completed
      - version
      properties:
        id:
          type: string
          format: uuid
        taskID:
          type: string
          format: uuid
        text:
          type: string
        completed:
          type: boolean
        version:
          type: integer
          minimum: 1
    CriterionCreate:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        completed:
          type: boolean
          default: false
    CriterionUpdate:
      type: object
      required:
      - version
      description: Mindestens text oder completed angeben. completed setzt den Zielzustand ausdrücklich; kein blindes
        Umschalten bei Wiederholung.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
        completed:
          type: boolean
        version:
          type: integer
          minimum: 1
    Activity:
      type: object
      required:
      - id
      - sequence
      - actorType
      - actorID
      - kind
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        actorType:
          type: string
          enum:
          - Person
          - Integration
          - Run
        actorID:
          type: string
          format: uuid
        kind:
          type: string
          description: comment.created/updated/deleted, criterion.created/updated/deleted; weitere Ereignisse über
            recordActivity.
        subjectID:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    ActivityPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        nextCursor:
          type: string
          nullable: true
          description: Fehlt am Listenende. Aufgaben-ID und letzte Sequenz, für Clients als undurchsichtiger Cursor
            zu behandeln.
    Error:
      type: object
      properties:
        error:
          type: boolean
        reason:
          type: string
