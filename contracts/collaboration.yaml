openapi: 3.0.3
info:
  title: Todo Zusammenarbeit
  version: 1.0.0
  description: 'Etappe 2: Kommentare, Verlauf und Abnahmekriterien. Alle Ressourcen werden über ProjectAccess geprüft;
    Fremdes ist 404. Verschachtelte Ressourcen müssen zur Aufgabe gehören. Texte werden außen getrimmt und dürfen
    danach 1–10000 Zeichen enthalten. Jede erfolgreiche Mutation erzeugt atomar ein Ereignis; Konflikte und Idempotenzwiederholungen
    erzeugen keines. Fehlermeldungen sind technische Codes. Bestehende Aufgaben-/Projektcontroller erzeugen noch
    keine Ereignisse. Migration: CreateCollaborationSchema (vier Tabellen, keine Datenübernahme); explizit vor Serverstart
    ausführen. Erforderliche effektive Rolle (inkl. Team-Freigaben): Lesen = read, Kommentare anlegen/ändern/löschen = comment
    (Ändern nur durch den Autor, Löschen durch den Autor oder manage), Abnahmekriterien ändern = edit. Sichtbar, aber
    ohne ausreichende Rolle: 403; unsichtbar: 404.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/tasks/{taskID}/comments:
    parameters:
    - name: taskID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: listComments
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          description: Ungültige Eingabe oder fehlende Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aufgabe oder Ressource fehlt oder ist fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createComment
      responses:
        '201':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          description: Ungültige Eingabe oder fehlende Version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aufgabe oder Ressource fehlt oder ist fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: version_conflict oder idempotency_conflict; keine Änderung und kein Aktivitätsereignis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[!-~]+$
        description: 'Optional; bei wiederholbaren Schreibvorgängen mitsenden. Groß-/Kleinschreibung relevant. Gültig
          pro Person und Aufgabe bis zur Aufgabenlöschung. Identischer normalisierter Text liefert dieselbe ursprüngliche
          Antwort (201, Version 1), auch nach Bearbeitung/Löschung. Anderer Text mit gleichem Schlüssel: 409. Ohne
          Schlüssel kann jede Anfrage einen Kommentar erzeugen.'
  /v1/tasks/{taskID}/comments/{resourceID}:
    parameters:
    - name: taskID
