openapi: 3.1.0
info:
  title: Todolino – Steuerzentrale, Agentenhandbuch, Fragen, Reviews, Fortschritt, Build-Screenshots
  version: 1.4.0
  description: 'ADR 0014. Alle Pfade außer /v1/manual verlangen Sitzung oder Bearer. Unsichtbare/fremde Objekte: 404, zu geringe Rolle: 403,
    Konflikte: 409. Zuordnung der Lanes (feste Reihenfolge): done > question > review > blocked > running > ready; Backlog-Spalten nur im Zähler.
    Fortschritt: done=100 (status), sonst Unteraufgaben, sonst Kriterien, sonst letzter Notiz-Prozentwert (agent), sonst 0 (none).
    Schreiben: Fragen/Fortschritt/Review anfordern/claim/structure = edit; Frage beantworten = comment; Review entscheiden = edit
    (benannter Reviewer: manage); Agent-Briefing schreiben = manage. MCP-Werkzeuge: get_manual, get_project_structure, get_command_center,
    get_task_context, claim_task, release_task, post_progress, set_task_structure, add_criterion, set_criterion, ask_question,
    list_open_questions, get_question, answer_question, request_review, list_pending_reviews, decide_review, apply_agent_workflow_columns,
    add_attachment, begin_attachment, complete_attachment, list_builds, wait_for_events (Long-Poll bis 25 s, nur Hinweise
    {changed, token, hints[{kind,taskID,projectID}]} auf Projekte des Grants, die das Konto sieht; Quelle live_events, ADR 0022) (Details: docs/agent-manual.md, tools/list). Neues Werkzeug update_project (projects:write). Neuer Scope attachments:write. Aktuelles Projekt (Handbuch 1.16.0, nur MCP, REST unverändert): get_command_center, list_open_questions, list_pending_reviews nehmen projectID und scope=project|account; Antworten tragen currentProject {id,name}, hint und foreignProject; die beiden Listen antworten {currentProject, hint?, items}.
    Spaltenvorlage: POST /v1/projects/{id}/columns/template {"source":"agent_workflow"} (project-columns.yaml). Kein Sync-Feed.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/manual:
    get:
      operationId: getAgentManual
      summary: Versioniertes Agentenhandbuch (öffentlich); ?section=<id>
      responses:
        '200': {description: '{version, sections[{id,title}], section, format, content (Markdown), conventions}'}
        '404': {description: unknown_section}
  /v1/command-center:
    get:
      operationId: getCommandCenter
      summary: Kanban-/Listenübersicht (Steuerzentrale)
      description: 'Query: scope=account|project, projectID, includeSubprojects(true), view=kanban|list, lane=a,b, kind=task|feature, hasQuestion, orphaned,
        includeSubtasks(list), sort=attention|updated|due|progress|title, doneWithinDays(7), laneLimit(50), updatesLimit(20), limit(50), offset.
        Antwort: {generatedAt, scope, projectID, view, summary{running,question,review,ready,blocked,done,backlog,overdue,openQuestions,pendingReviews,features,activeAgents,staleProjects,orphanedClaims},
        lanes[{key,title,count,truncated,cards[]}] (kanban) | items[], total (list), updates[], builds[], projects[{projectID,name,sync}] (project-sync.yaml)}. Karte: {task,project,kind,isFeature,parentTaskID,lane,
        progress{percent,source,subtasks*,criteria*},agent,openQuestionCount,questions[3],pendingReview,blockedReason,blockedBy,latestUpdate,builds[3],buildCount,dueDate,nextDue,priority,subtasks[],orphaned,lastSignOfLifeAt}. Verwaiste Ansprüche (additiv, 1.2.0): orphaned=true, wenn die Aufgabe (oder eine Unteraufgabe der Karte) in_progress ist, einen Anspruch (claim_task) hat und das jüngste Lebenszeichen älter als 24 h ist (strikt >); Lebenszeichen = jüngster Zeitpunkt aus Fortschrittsnotiz, Kommentar, Aktivitätseintrag der Aufgabe (u. a. Statuswechsel), Runner-Event der Jobs der Aufgabe (u. a. Checkpoint), mindestens claimedAt; lastSignOfLifeAt nur bei Anspruch (bei verwaisten Karten der älteste verwaiste Eintrag). Nur Kennzeichnung, keine automatische Freigabe. summary.orphanedClaims zählt alle lesbaren verwaisten Ansprüche (inkl. Unteraufgaben) vor Kartenfiltern; Query orphaned=true|false filtert Karten (kanban und list), sonst invalid_orphaned (400). WorkflowDTO (GET /v1/tasks/{id}/context, claim) trägt orphaned und lastSignOfLifeAt. summary.overdue zählt alle sichtbaren nicht erledigten Aufgaben mit planning.dueAt < generatedAt, einschließlich Backlog/Unteraufgaben, vor Kartenfiltern und Seitenteilung; Scope und OAuth-Grant gelten. dueDate ist die eigene planning.dueAt, nextDue die früheste Fälligkeit der nicht erledigten Aufgabe/Unteraufgaben (auch im kompakten MCP-Modus).'
      responses:
        '200': {description: Erfolgreich}
        '400': {description: invalid_scope, project_required, invalid_view, invalid_lane, invalid_sort, ...}
        '404': {description: Projekt fehlt oder unsichtbar}
  /v1/daily-brief:
    get:
      operationId: getDailyBrief
      summary: Tagesbericht (additiv, 1.3.0; MCP get_daily_brief, tasks:read)
      description: 'Query: projectID (optional; sonst alle lesbaren Projekte des Kontos, mit Unterprojekten), since (ISO 8601 oder YYYY-MM-DD, UTC; Standard Beginn von gestern in UTC),
        format=full|line (Standard full). Antwort full: {generatedAt, since, scope, projectID, format, line, summary{waiting,openQuestions,pendingReviews,pendingConfirmations,orphanedClaims,staleProjects,running,done,decisionsToReview},
        sections[{key,title,count,truncated,items[{id,title,projectID,kind}]}]} mit Abschnitten in fester Reihenfolge waiting, decisions (offene Journal-Entscheidungen seit since, neueste zuerst, kind decision), orphaned, stale, running, done; count ist immer exakt, items höchstens 5 (waiting älteste zuerst, done neueste zuerst),
        Titel höchstens 120 Zeichen. Antwort line: {generatedAt, since, scope, projectID, format, line} ohne summary und sections. line ist eine deutsche Zeile mit höchstens 200 Zeichen
        (Ruhetag: "Alles ruhig: nichts wartet auf dich."). Erledigt = Status done und updatedAt >= since. Bestätigungsanfragen (kind confirmation, projectID null) zählen nur ohne projectID.
        Rechte wie /v1/command-center: nur lesbare Projekte.'
      responses:
        '200': {description: Erfolgreich}
        '400': {description: 'invalid_since (auch Zeitpunkt in der Zukunft), invalid_format, invalid_project'}
        '401': {description: Nicht angemeldet}
        '404': {description: Projekt fehlt oder unsichtbar}
  /v1/tasks/{id}/decisions:
    get:
      operationId: listTaskDecisions
      summary: Entscheidungsjournal einer Karte (additiv, 1.4.0; MCP list_decisions, tasks:read)
      responses: {'200': {description: 'DecisionDTO[]'}, '404': {description: unsichtbar}}
    post:
      operationId: recordDecision
      summary: Entscheidung protokollieren (edit; MCP record_decision, tasks:write)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [decision, rationale, criterion], properties: {decision: {type: string, maxLength: 2000}, rationale: {type: string, maxLength: 2000}, criterion: {type: string, maxLength: 2000}, rollbackRef: {type: string, maxLength: 200, description: 'Commit-Hash oder Branch; Zeichen A-Z a-z 0-9 . _ / - @ +'}, agentName: {type: string}}}}}}
      responses: {'201': {description: 'DecisionDTO (state open)'}, '400': {description: 'invalid_decision, invalid_rationale, invalid_criterion, invalid_rollback_ref'}}
  /v1/decisions:
    get:
      operationId: listDecisions
      summary: 'Journal ?projectID&since&state=open|ok|rolled_back|all&q&limit (neueste zuerst; state=rolled_back + q = Präzedenzfälle)'
      responses: {'200': {description: 'DecisionDTO[] {id,taskID,taskTitle,projectID,projectName,decision,rationale,criterion,rollbackRef,actorType,actorLabel,state,reviewNote,reviewedAt,createdAt,version}'}, '400': {description: invalid_filter, invalid_since}}
  /v1/decisions/{id}/review:
    post:
      operationId: reviewDecision
      summary: Entscheidung als ok markieren oder zurücknehmen (edit; MCP review_decision, tasks:write)
      description: 'verdict ok|rollback; rollback verlangt note (note_required) und bleibt als Präzedenzfall abrufbar. Markiert nur; das Zurückrollen (git) ist separate Arbeit. Eine MCP-Verbindung darf eigene Entscheidungen nicht prüfen (403 cannot_review_own_decision).'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [verdict], properties: {verdict: {type: string, enum: [ok, rollback]}, note: {type: string, maxLength: 4000}}}}}}
      responses: {'200': {description: DecisionDTO}, '400': {description: 'invalid_verdict, note_required'}, '403': {description: cannot_review_own_decision}, '404': {description: unsichtbar}}
  /v1/projects/{id}/structure:
    get:
      operationId: getProjectStructure
      summary: Briefing, Spalten mit Rollen, Vorlagenstatus, Zähler, Regeln
      responses: {'200': {description: Erfolgreich}, '404': {description: unsichtbar}}
  /v1/projects/{id}/agent-brief:
    get:
      operationId: getAgentBrief
      summary: Agent-Briefing (Markdown) lesen
      responses: {'200': {description: '{projectID,text,version,updatedAt}'}}
    put:
      operationId: putAgentBrief
      summary: Briefing schreiben (manage, version Pflicht, 0 = neu; max. 20000 Zeichen)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [text, version], properties: {text: {type: string}, version: {type: integer}}}}}}
      responses: {'200': {description: Gespeichert}, '409': {description: version_conflict}}
  /v1/questions:
    get:
      operationId: listQuestions
      summary: 'Fragen ?projectID&taskID&state=open|answered|all&includeSubprojects&limit'
      responses: {'200': {description: 'QuestionDTO[] (inkl. taskTitle, projectName, askedByType Person|Integration|Run, options, blocking, answer, agentQuestionID)'}}
  /v1/questions/{id}:
    get:
      operationId: getQuestion
      responses: {'200': {description: QuestionDTO}}
  /v1/questions/{id}/answer:
    post:
      operationId: answerQuestion
      summary: 'Antwort {answer, freeText?}; bei Optionen muss answer eine davon sein, außer freeText=true (eigener Text, additiv); Runner-Fragen laufen über AgentService.answer'
      responses: {'200': {description: QuestionDTO}, '400': {description: invalid_answer_option}, '409': {description: question_already_answered}}
  /v1/reviews:
    get:
      operationId: listReviews
      summary: '?projectID&state=pending|accepted|changes_requested|withdrawn|all&limit'
      responses: {'200': {description: 'ReviewDTO[]'}}
  /v1/tasks/{id}/context:
    get:
      operationId: getTaskContext
      summary: Aufgabe mit Workflow, Fortschritt, Notizen, Kriterien, Unteraufgaben, Kommentaren, Fragen, Review, Builds
      responses: {'200': {description: TaskContextDTO}}
  /v1/tasks/{id}/claim:
    post:
      operationId: claimTask
      summary: 'Body optional {agentName, takeOver}; 409 already_claimed'
      responses: {'200': {description: TaskContextDTO}}
    delete:
      operationId: releaseTask
      summary: '?force=true; 409 claimed_by_other'
      responses: {'200': {description: TaskContextDTO}}
  /v1/tasks/{id}/progress-notes:
    get:
      operationId: listProgressNotes
      responses: {'200': {description: 'ProgressNoteDTO[]'}}
    post:
      operationId: postProgressNote
      summary: '{note, percent?}'
      responses: {'201': {description: ProgressNoteDTO}}
  /v1/tasks/{id}/questions:
    get:
      operationId: listTaskQuestions
      responses: {'200': {description: 'QuestionDTO[]'}}
    post:
      operationId: askQuestion
      summary: '{prompt, options?, blocking?, agentName?, idempotencyKey?}'
      responses: {'201': {description: QuestionDTO}}
  /v1/tasks/{id}/review:
    post:
      operationId: requestReview
      summary: '{summary, reviewerID?, agentName?}; Status in_review'
      responses: {'200': {description: ReviewDTO}, '409': {description: review_already_pending}}
  /v1/tasks/{id}/review/decision:
    post:
      operationId: decideReview
      summary: '{decision: accept|request_changes, note?}'
      responses: {'200': {description: 'ReviewDTO (undoUntil = Ende des Rückgängig-Fensters, nur bei Entscheidung durch eine Person)'}, '409': {description: no_pending_review}}
  /v1/tasks/{id}/review/undo:
    post:
      operationId: undoReviewDecision
      summary: 'Nimmt die letzte Review-Entscheidung der Person binnen 5 Minuten zurück; Review wieder pending, Aufgabe in Status/Spalte davor (ADR 0027)'
      responses: {'200': {description: 'ReviewDTO (pending)'}, '409': {description: 'nothing_to_undo, not_undoable, undo_window_expired, already_acted_on'}}
  /v1/tasks/{id}/structure:
    put:
      operationId: setTaskStructure
      summary: '{kind?, parentTaskID? (null löst), blockedReason? (null löscht)}'
      responses: {'200': {description: WorkflowDTO}, '422': {description: parent_must_share_project, subtask_depth_exceeded, invalid_parent}}
  /v1/tasks/{id}/builds:
    get:
      operationId: listTaskBuilds
      responses: {'200': {description: 'BuildArtifactDTO[] {id,attachmentID,taskID,buildID,label,platform,filename,mediaType,size,previewURL,createdAt}'}}
  /v1/builds:
    post:
      operationId: registerBuild
      summary: 'Fertigen Anhang als Build registrieren {attachmentID, buildID, label?, platform?} (Upload über /v1/attachments/begin, role result)'
      responses: {'201': {description: BuildArtifactDTO}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
    sessionCookie: {type: apiKey, in: cookie, name: session}
