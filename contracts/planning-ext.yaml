openapi: 3.1.0
info:
  title: Todolino – Planungserweiterung
  version: 1.3.0
  description: 'Erweiterung des bestehenden Vertrags. ISO-8601-Zeitpunkte; Priorität 0 (keine) bis 3 (hoch). PUT
    ersetzt alle Planungsdaten. Wiederholungen benötigen dueAt oder plannedAt und erzeugen höchstens eine Folgeinstanz
    je Ursprungsaufgabe, auch nach Wiederöffnung. Datum und Erinnerungen werden je Kalenderintervall verschoben;
    until ist inklusive. Keine Pushzustellung. Beim Projektwechsel werden Abhängigkeiten und Meilensteinzuordnungen
    entfernt. Alle Ansichten prüfen ProjectAccess. Details: Sources/TodoKit/PlanningExt/ADR.md. Ab 1.1.0 (ADR 0033): plannedAt ist der geplante Start (Anzeigename Geplanter Start), dazu plannedMinutes (5 bis 1440) und plannedAllDay; PATCH /v1/tasks/{id}/schedule ist der einzige Teilschreibweg für Kalender-Drag&Drop, GET /v1/planning/schedule liefert das Kalenderfenster. PUT übernimmt plannedMinutes/plannedAllDay nur, wenn der Schlüssel im Body steht (fehlt er, bleibt der Wert; null löscht). Ab 1.2.0 (ADR 0033 Stufe C): autoStart/autoStartedAt in Planungsantworten und ScheduleEntry mit echten Werten; PUT /v1/tasks/{id}/auto-start (nur Sitzung, Projekteigentümer) und GET/PUT /v1/settings/auto-start (Kontoschalter, Standard aus). Änderungen an Titel, Beschreibung, Projekt oder plannedAt löschen autoStart (Aktivität agent.auto_start_revoked), plannedMinutes nur bei Änderung durch jemand anderen als den Eigentümer in Person. Ab 1.3.0 (Karte 21CF716D, rein additiv): RecurrenceRule trägt optional weekdays (ISO-Wochentage 1 Montag bis 7 Sonntag, nur mit weekly, eindeutig, nicht leer), basis (due = Standard, Zählung ab Fälligkeit; completion = ab dem Kalendertag der Erledigung in timeZone, die Uhrzeit der bisherigen Fälligkeit/Planung bleibt) und monthDay (1 bis 31, nur mit monthly; kurze Monate nehmen ihren letzten Tag, der Stichtag driftet nicht). Fehlende Felder werden nicht ausgegeben (nil nicht kodiert): Regeln ohne die neuen Felder und ihre Folgeinstanzen sind byte-gleich zu 1.2.0. Ungültige Kombinationen und Werte: 400 invalid_recurrence. Nächstes Vorkommen mit weekdays: vom Basis-Kalendertag (Woche Montag bis Sonntag) der nächste größere gewählte Wochentag derselben Woche, sonst der kleinste gewählte Wochentag der Woche +interval. Erinnerungen der Folgeinstanz: hat die Regel mindestens eines der neuen Felder, verschieben sie sich um dieselbe Zeitdifferenz wie Fälligkeit (sonst Planung); sonst wie bisher je Erinnerung um ein Intervall. Es ist keine Migration nötig, die Regel liegt in einer JSON-Spalte. Ältere Clients (Apple vor Folgekarte A18F3FF7) kennen die Felder nicht und verlieren sie, wenn sie eine Regel vollständig neu schreiben.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/planning/tasks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Planungsdaten lesen
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
    put:
      summary: Planungsdaten vollständig ersetzen; fehlende optionale Felder löschen
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningData'
  /v1/planning/board:
    get:
      summary: Sichtbare Aufgaben einer Projekt-/Statusspalte in Boardreihenfolge
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      parameters:
      - name: projectID
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: true
        schema:
          type: string
  /v1/planning/board/reorder:
    put:
      summary: Vollständige sichtbare Spalte atomar sortieren
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reorder'
  /v1/planning/tasks/{id}/dependencies:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Nur sichtbare Voraussetzungen, ohne fremde Titel oder IDs
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
    put:
      summary: Voraussetzung idempotent hinzufügen; Zyklen ergeben 422
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prerequisiteID:
                  type: string
                  format: uuid
              required:
              - prerequisiteID
  /v1/planning/tasks/{id}/dependencies/{other}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: other
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      summary: Voraussetzung entfernen
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
  /v1/planning/dependencies:
    get:
      summary: Alle Abhängigkeiten zwischen sichtbaren Aufgaben eines Projekts (optional mit Unterprojekten), schreibgeschützt
      parameters:
      - name: projectID
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: includeSubprojects
        in: query
        required: false
        schema:
          type: boolean
      - name: details
        in: query
        required: false
        description: Additiv. true liefert je Aufgabe zusätzlich title, status, projectID, dueAt, builds und die Meilensteine mit sichtbaren Mitgliedern (die Graph-Ansicht braucht dann nur diesen Aufruf). Ohne den Parameter bleibt die Antwort unverändert.
        schema:
          type: boolean
      responses:
        '200':
          description: Kanten Aufgabe -> Voraussetzung und Aufgabenfakten; verdeckte Aufgaben erscheinen nie
          content:
            application/json:
              schema:
                type: object
                properties:
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        taskID: {type: string, format: uuid}
                        prerequisiteID: {type: string, format: uuid}
                      required: [taskID, prerequisiteID]
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        taskID: {type: string, format: uuid}
                        kind: {type: string, enum: [task, feature]}
                        parentTaskID: {type: string, format: uuid, nullable: true}
                        createdAt: {type: string, format: date-time, nullable: true}
                        updatedAt: {type: string, format: date-time, nullable: true}
                        claimedLabel: {type: string, nullable: true, description: Agent oder Person, die die Aufgabe bearbeitet}
                        title: {type: string, description: Nur mit details=true}
                        status: {type: string, enum: [open, in_progress, in_review, done], description: Nur mit details=true}
                        projectID: {type: string, format: uuid, description: Nur mit details=true}
                        dueAt: {type: string, format: date-time, nullable: true, description: Nur mit details=true}
                        builds:
                          type: array
                          description: Nur mit details=true und nur wenn die Aufgabe fertige Build-Artefakte hat (additiv). Artefakte nach buildID gruppiert, neueste zuerst.
                          items:
                            type: object
                            properties:
                              buildID: {type: string}
                              label: {type: string, nullable: true}
                              platform: {type: string, nullable: true}
                              count: {type: integer, description: Anzahl der Artefakte dieses Builds an der Aufgabe}
                              createdAt: {type: string, format: date-time, nullable: true, description: Neuestes Artefakt}
                            required: [buildID, count]
                      required: [taskID, kind]
                  milestones:
                    type: array
                    description: Nur mit details=true. Meilensteine des Projekts; tasks sind die sichtbaren Mitglieder im Teilbaum (auch außerhalb der angefragten Projekte).
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        title: {type: string}
                        dueAt: {type: string, format: date-time, nullable: true}
                        tasks:
                          type: array
                          items:
                            type: object
                            properties:
                              taskID: {type: string, format: uuid}
                              status: {type: string, enum: [open, in_progress, in_review, done]}
                            required: [taskID, status]
                      required: [id, title, tasks]
                required: [edges, tasks]
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Projekt
  /v1/planning/milestones:
    post:
      summary: Meilenstein anlegen
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Milestone'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneInput'
    get:
      summary: Meilensteine mit sichtbaren Aufgaben aus dem Projekt und seinen Unterprojekten
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MilestoneWithTasks'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      parameters:
      - name: projectID
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /v1/planning/milestones/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      summary: Meilenstein löschen
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
  /v1/planning/milestones/{id}/tasks/{other}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: other
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      summary: Sichtbare Aufgabe aus Projekt oder Unterprojekt idempotent zuordnen
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
    delete:
      summary: Zuordnung entfernen
      responses:
        '204':
          description: Erfolgreich
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
  /v1/tasks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      summary: 'Bestehende Aufgaben-PATCH-Route: Abschluss und Folgeinstanz atomar'
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum:
                  - open
                  - in_progress
                  - in_review
                  - done
                projectID:
                  type: string
                  format: uuid
              required:
              - version
  /v1/tasks/{id}/schedule:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    patch:
      summary: Geplanten Start, Dauer und Ganztägig ändern (Kalender-Drag&Drop); nur diese Felder, Rolle edit
      description: >-
        Nur mitgesendete Schlüssel werden geändert; null löscht. Priorität, Wiederholung, Erinnerungen, dueAt bleiben unberührt.
        Prüft version (409 version_conflict) und erhöht sie, schreibt Aktivität task.scheduled, erzeugt einen Sync-Upsert.
        plannedMinutes 5 bis 1440 (sonst 400 invalid_planned_minutes). plannedAllDay=true braucht plannedAt (400 all_day_requires_planned_at);
        plannedAt=null setzt plannedAllDay auf false und löscht plannedMinutes. Löschen von plannedAt bei Wiederholung ohne dueAt: 400 recurrence_requires_date.
        Erledigte Aufgaben: 409 task_done. Fremde oder verdeckte Aufgabe: 404, nur Leserechte: 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleUpdate'}
      responses:
        '200':
          description: Aktualisierte Planung mit neuer Aufgabenversion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanningTask'}
        '400': {description: Ungültige Eingabe}
        '401': {description: Sitzung erforderlich}
        '403': {description: Nur Leserechte}
        '404': {description: Fehlendes oder fremdes Objekt}
        '409': {description: version_conflict oder task_done}
  /v1/tasks/{id}/auto-start:
    parameters:
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    put:
      summary: Wächter darf diese Karte zum geplanten Start automatisch starten (Ein-Mal-Erlaubnis)
      description: >-
        Nur Personen-Sitzung (OAuth-Zugriffstoken und Runner-Gerätetoken erhalten 403 session_required) und nur der Projekteigentümer (wie startAgent, sonst 403).
        Prüft version (409 version_conflict) und erhöht sie bei einer Änderung. enabled=true verlangt: Karte nicht done (409 task_done), plannedAt gesetzt
        (409 planned_start_required), nicht ganztägig (409 all_day_not_allowed), genau eine nutzbare Bindung eines eigenen Geräts oder das gewählte deviceID
        (409 no_binding, 409 device_required). Aktivität agent.auto_start_enabled bzw. agent.auto_start_disabled (nur bei Änderung); enabled=false ist idempotent.
        Die Erlaubnis erlischt nach der Übergabe an den Runner (autoStart=false, autoStartedAt gesetzt) und bei Änderung von Titel, Beschreibung, Projekt oder plannedAt
        (sowie plannedMinutes durch Dritte, Agenten oder Sync): Aktivität agent.auto_start_revoked. Kein MCP-Weg.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                enabled: {type: boolean}
                deviceID: {type: string, format: uuid, description: Optional, wählt das Runner-Gerät bei mehreren Bindungen}
              required: [version, enabled]
      responses:
        '200': {description: PlanningTask mit autoStart/autoStartedAt}
        '401': {description: Sitzung erforderlich}
        '403': {description: Kein Eigentümer oder kein Personen-Sitzungstoken (session_required)}
        '404': {description: Fehlendes oder fremdes Objekt}
        '409': {description: version_conflict, task_done, planned_start_required, all_day_not_allowed, no_binding oder device_required}
  /v1/settings/auto-start:
    get:
      summary: Kontoschalter "Automatische Starts erlauben" lesen (nur Sitzung)
      responses:
        '200':
          description: '{allowed, updatedAt}; allowed ist ohne Eintrag false'
        '401': {description: Sitzung erforderlich}
        '403': {description: OAuth- oder Runner-Token (session_required)}
    put:
      summary: Kontoschalter setzen (nur Sitzung, Standard aus)
      description: >-
        Ist der Schalter aus, startet der Wächter nichts, egal was an den Karten steht: start_agent_job mit origin scheduler antwortet 403 auto_start_disabled_for_account.
        Der Stand erscheint auch in GET /v1/system-status (autoStartAllowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed: {type: boolean}
              required: [allowed]
      responses:
        '200': {description: '{allowed, updatedAt}'}
        '400': {description: Ungültiger Body}
        '401': {description: Sitzung erforderlich}
        '403': {description: OAuth- oder Runner-Token (session_required)}
  /v1/planning/schedule:
    get:
      summary: Kalenderfenster, Karten mit Start, Frist oder ganztägiger Zuordnung im Fenster (nur sichtbare Projekte)
      description: >-
        Rolle read, ProjectAccess wie alle Planungsansichten (fremde Karten erscheinen nie; über OAuth/MCP nur Projekte im Grant).
        Eintrag, wenn plannedAt (Start bis Start+Dauer, Standard 30 Minuten) das Fenster [from, to) schneidet oder dueAt in [from, to) liegt.
        Ganztägige Karten gelten als Eintrag, wenn plannedAt in [from, to) liegt. Erledigte Karten sind enthalten (status done).
        Sortierung: plannedAt, dann dueAt, dann id. Fenster höchstens 62 Tage (sonst 400 window_too_large), to muss nach from liegen
        (400 invalid_window), limit 1 bis 500 (Standard 500).
      parameters:
      - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
      - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      - {name: projectID, in: query, required: false, schema: {type: string, format: uuid}, description: Optional einschränken (inklusive Unterprojekte)}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 500}}
      responses:
        '200':
          description: Kalendereinträge
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScheduleResponse'}
        '400': {description: invalid_window, window_too_large oder ungültige Parameter}
        '401': {description: Sitzung erforderlich}
        '404': {description: Fehlendes oder fremdes Projekt}
  /v1/planning/unscheduled:
    get:
      summary: Ungeplante Karten für die Kalender-Seitenleiste (nicht erledigt, ohne plannedAt)
      description: PlanningTask-Liste mit ProjectAccess wie die übrigen Planungsansichten. Sortierung Priorität absteigend, dann Fälligkeit, dann id; limit 1 bis 500 (Standard 200).
      parameters:
      - {name: projectID, in: query, required: false, schema: {type: string, format: uuid}}
      - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanningTask'}
        '401': {description: Sitzung erforderlich}
        '404': {description: Fehlendes oder fremdes Projekt}
  /v1/planning/today:
    get:
      summary: 'Heute: Fälligkeit im aktuellen Kalendertag'
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      parameters:
      - name: timeZone
        in: query
        required: false
        schema:
          type: string
          default: UTC
  /v1/planning/upcoming:
    get:
      summary: 'Demnächst: Fälligkeit ab dem nächsten Kalendertag'
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      parameters:
      - name: timeZone
        in: query
        required: false
        schema:
          type: string
          default: UTC
  /v1/planning/up-next:
    get:
      summary: 'Als Nächstes: unerledigt, nicht blockiert; Priorität absteigend, dann Fälligkeit'
      responses:
        '200':
          description: Erfolgreich
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningTask'
        '400':
          description: Ungültige Eingabe
        '401':
          description: Sitzung erforderlich
        '404':
          description: Fehlendes oder fremdes Objekt
        '409':
          description: Versionskonflikt oder geändertes Board
        '422':
          description: Zyklus oder ungültige Projektzuordnung
      parameters:
      - name: timeZone
        in: query
        required: false
        schema:
          type: string
          default: UTC
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: todo_session
      description: Schreibzugriffe benötigen application/json und einen erlaubten Origin, falls gesendet.
  schemas:
    PlanningData:
      type: object
      properties:
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
        plannedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Geplanter Start (UTC-Zeitpunkt; Clients rendern in ihrer Zeitzone). Bei plannedAllDay der Tagesbeginn in der Zeitzone des setzenden Clients.
        plannedMinutes:
          type:
          - integer
          - 'null'
          minimum: 5
          maximum: 1440
          description: Dauer in Minuten; null = keine Dauer (Anzeige 30 Minuten). Additiv ab 1.1.0.
        plannedAllDay:
          type: boolean
          default: false
          description: Ganztägig, ohne Uhrzeit. Additiv ab 1.1.0; Antworten enthalten das Feld immer.
        priority:
          type: integer
          minimum: 0
          maximum: 3
        recurrence:
          anyOf:
          - $ref: '#/components/schemas/RecurrenceRule'
          - type: 'null'
        reminders:
          type: array
          maxItems: 100
          items:
            type: string
            format: date-time
      required:
      - priority
      - reminders
    ScheduleUpdate:
      type: object
      description: Teilschreibweise. Nicht mitgesendete Schlüssel bleiben unverändert, null löscht.
      properties:
        version: {type: integer, description: Erwartete Aufgabenversion}
        plannedAt: {type: [string, 'null'], format: date-time}
        plannedMinutes: {type: [integer, 'null'], minimum: 5, maximum: 1440}
        plannedAllDay: {type: boolean}
      required: [version]
    ScheduleEntry:
      type: object
      properties:
        taskID: {type: string, format: uuid}
        projectID: {type: string, format: uuid}
        title: {type: string}
        status: {type: string, enum: [open, in_progress, in_review, done]}
        version: {type: integer, description: Aufgabenversion für das nächste PATCH}
        plannedAt: {type: [string, 'null'], format: date-time}
        plannedMinutes: {type: [integer, 'null']}
        plannedAllDay: {type: boolean}
        dueAt: {type: [string, 'null'], format: date-time}
        blocked: {type: boolean, description: Offene Voraussetzung vorhanden}
        canEdit: {type: boolean, description: Rolle edit; sonst nur lesen (nicht ziehbar)}
        autoStart: {type: boolean, description: Owner hat dem Wächter erlaubt, die Karte zum Start automatisch zu übergeben (Ein-Mal-Erlaubnis)}
        autoStartedAt: {type: [string, 'null'], format: date-time, description: Zeitpunkt der automatischen Übergabe (Serveruhr), sonst null}
        jobState: {type: [string, 'null'], description: Zustand des neuesten Agent-Jobs der Karte, sonst null}
        repositoryKey: {type: [string, 'null'], description: Bindung des neuesten Agent-Jobs, sonst null}
        conflicts:
          type: array
          description: Serverseitig berechnete Hinweise, nie verhindernd. Clients dürfen zusätzlich selbst rendern.
          items:
            type: string
            enum: [after_due, prerequisite_later, prerequisite_open, repository_overlap]
      required: [taskID, projectID, title, status, version, plannedAllDay, blocked, canEdit, autoStart, conflicts]
    ScheduleResponse:
      type: object
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        truncated: {type: boolean, description: true, wenn limit erreicht wurde}
        items:
          type: array
          items: {$ref: '#/components/schemas/ScheduleEntry'}
      required: [from, to, truncated, items]
    RecurrenceRule:
      type: object
      properties:
        frequency:
          type: string
          enum:
          - daily
          - weekly
          - monthly
        interval:
          type: integer
          minimum: 1
          maximum: 1000
        timeZone:
          type: string
          description: IANA-Zeitzone
        until:
          type:
          - string
          - 'null'
          format: date-time
        weekdays:
          type: array
          description: Seit 1.3.0. ISO-Wochentage 1 Montag bis 7 Sonntag; nur mit frequency weekly, nicht leer, ohne Duplikate (sonst 400 invalid_recurrence). Reihenfolge beliebig, wird so gespeichert wie gesendet. Fehlt das Feld, gilt das bisherige Verhalten.
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 7
        basis:
          type: string
          description: Seit 1.3.0. due (Standard, Zählung ab Fälligkeit wie bisher) oder completion (Zählung ab dem Kalendertag der Erledigung in timeZone; Uhrzeit bleibt).
          enum:
          - due
          - completion
        monthDay:
          type: integer
          description: Seit 1.3.0. Tag im Monat; nur mit frequency monthly (sonst 400 invalid_recurrence). Kurze Monate nehmen ihren letzten Tag (31 wird 28, 29 oder 30), der folgende Monat nimmt wieder den Stichtag.
          minimum: 1
          maximum: 31
      required:
      - frequency
      - interval
      - timeZone
      examples:
      - {frequency: weekly, interval: 1, timeZone: Europe/Berlin, weekdays: [1, 4]}
      - {frequency: monthly, interval: 1, timeZone: UTC, monthDay: 31}
      - {frequency: daily, interval: 3, timeZone: Pacific/Auckland, basis: completion}
      - {frequency: weekly, interval: 2, timeZone: Europe/Berlin, until: '2027-12-31T00:00:00Z'}
    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectID:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - open
          - in_progress
          - in_review
          - done
        version:
          type: integer
      required:
      - id
      - projectID
      - title
      - description
      - status
      - version
    PlanningTask:
      allOf:
      - $ref: '#/components/schemas/PlanningData'
      - type: object
        properties:
          task:
            $ref: '#/components/schemas/Task'
          position:
            type: integer
          autoStart:
            type: boolean
            description: Ein-Mal-Erlaubnis für den Wächter (ADR 0033); nur über PUT /v1/tasks/{id}/auto-start schreibbar
          autoStartedAt:
            type: [string, 'null']
            format: date-time
        required:
        - task
        - position
        - autoStart
    Reorder:
      type: object
      properties:
        projectID:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - open
          - in_progress
          - in_review
          - done
        taskIDs:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - projectID
      - status
      - taskIDs
    MilestoneInput:
      type: object
      properties:
        projectID:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        dueAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - projectID
      - title
    Milestone:
      allOf:
      - $ref: '#/components/schemas/MilestoneInput'
      - type: object
        properties:
          id:
            type: string
            format: uuid
        required:
        - id
    MilestoneWithTasks:
      type: object
      properties:
        milestone:
          $ref: '#/components/schemas/Milestone'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - milestone
      - tasks
