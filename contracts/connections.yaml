openapi: 3.0.3
info:
  title: Todolino MCP-Verbindungen im Teilen-Fenster
  version: 1.8.0
  description: 'ADR 0028. Eine MCP-Verbindung (OAuth-Grant) ist ein eigener Beteiligter eines Projekts neben Personen und Teams. Ihr Zugriff ist durch
    die Rechte der Person (wirksame Rolle) UND die Projektliste/Scopes des Grants begrenzt, nie größer als der Besitzer; es gibt keine eigene Rolle.
    Das Feld role der Antwort ist die aktuelle Rolle des Besitzers im Projekt. Name der Verbindung: Feld name von GET /oauth/grants
    (Standard = Clientname, änderbar per PATCH /oauth/grants/{id}). Zugriffshinweise: fragt eine Verbindung ein Projekt außerhalb ihres Grants an
    (MCP-Antwort unverändert not_found) und kann ihr Besitzer das Projekt lesen, entsteht je Verbindung und Projekt ein Hinweis (Anzahl, letzter
    Zeitpunkt, höchstens ein Zähler-Schritt je Minute); er erscheint in GET /v1/feed als accessRequests[] und in
    GET /v1/command-center summary.pendingAccessRequests. Erlauben fügt das Projekt dem Grant hinzu (Klick des Kontoinhabers ist die Bestätigung),
    Ignorieren schaltet den Hinweis still. Entschiedene Hinweise räumt cleanup-expired nach 7 Tagen auf, offene nach 30 Tagen ohne Wiederholung.
    1.1.0 (Brain-Vollmacht, ADR 0032): /v1/settings/brain-mandate. Die Person gibt höchstens einer ihrer Verbindungen eine Vollmacht für genau die genannten Projekte (keine Vererbung auf Unterprojekte); nur diese Verbindung darf mit decide_review/answer_question als Agent entscheiden. Verwaltung ausschließlich mit Personen-Sitzung, OAuth-Tokens erhalten 401; es gibt keinen MCP-Schreibweg.
    1.2.0 (ADR 0032 Nachtrag 23.11.2026, Karte 2280A2F1): eine Vollmacht je Verbindung statt einer je Person. GET liefert {mandates: [...]} (Liste, zuletzt geändert zuerst; das bisherige Feld mandate entfällt), PUT erteilt/überschreibt die Vollmacht genau der genannten Verbindung und lässt die übrigen unberührt, DELETE /v1/settings/brain-mandate/{grantID} widerruft nur diese Verbindung, DELETE ohne ID widerruft alle. Sicherheitsregeln unverändert (kein MCP-Schreibweg, eigene Reviews/Fragen gesperrt, Widerruf sofort, Zitat-Pflicht, Audit).
    1.3.0 (ADR 0032 Nachtrag 24.11.2026, Karte E71B0FF1): eine Verbindung mit aktiver Vollmacht liest und ändert per MCP die Projektliste (OAuthGrant.projects) der anderen Verbindungen derselben Person, nur für Projekte ihrer eigenen Vollmacht (Abschnitt x-mcp-tools: list_connections, set_connection_projects). Das Protokoll GET /v1/settings/brain-mandate/audit zeigt zusätzlich die Änderungen (kind connection.project_added|connection.project_removed); taskID ist dort nicht gesetzt, subjectID ist die geänderte Verbindung. Es gibt weiterhin keinen MCP-Schreibweg für Vollmachten.
    1.4.0 (Karte 74EC341D, additiv, contracts/pipeline.yaml): die Vollmacht gilt auch für decide_plan; das Protokoll kennt zusätzlich kind plan.approved|plan.changes_requested (subjectID ist der Plan).
    1.5.0 (Karte B926E7D8, Pipeline Stufe 2, additiv): das Protokoll GET /v1/settings/brain-mandate/audit kennt zusätzlich kind pipeline.settings (MCP update_pipeline_settings unter Vollmacht): taskID fehlt, projectID und subjectID sind das geänderte Projekt, grantID die handelnde Verbindung, quote das Zitat, note fehlt.
    1.6.0 (Karte BEF08998, ADR 0036, additiv): eine Neuanmeldung kann Projekte und Vollmacht übernehmen (contracts/oauth-mcp.yaml 1.11.0). BrainMandateDTO kennt grantRevokedReason und takenOver {fromGrantID, fromName, at}; das Protokoll kennt kind mandate.taken_over|connection.taken_over (taskID fehlt, grantID die neue, subjectID die frühere Verbindung, quote ist ein Servertext, keine Worte der Person).
    1.7.0 (Security-Review Karte BEF08998, ADR 0036): eine Übernahme ohne gemeinsames Projekt und ohne Vollmacht schreibt genau eine Zeile connection.taken_over, deren projectID gleich subjectID (die frühere Verbindung) ist.
    1.8.0 (Karte BEF08998, ADR 0037, additiv, Handbuch 1.49.0): Projektgruppen (/v1/project-groups, /v1/projects/{id}/groups, /v1/project-selection/preview, nur Personen-Sitzung, kein MCP-Schreibweg) und optionales selection bei PUT /v1/settings/brain-mandate. BrainMandateDTO.projectIDs ist jetzt die wirksame Menge; neu explicitProjectIDs und selection. projectIDs darf leer sein, wenn selection eine Gruppe oder mode all_except nennt. PUT ohne selection ersetzt eine Regel durch die gesendete Liste. Protokoll: kind mandate.group_added|mandate.group_removed (quote ist ein Servertext). addProjectConnection und set_connection_projects heben einen Ausschluss genau dieses Projekts auf (409 excluded_by_group bei ausgeschlossener Gruppe); Entfernen schliesst ein Projekt aus, das eine Gruppe oder "alle" mitbringt.'
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/projects/{id}/connections:
    get:
      operationId: listProjectConnections
      summary: Verbindungen, die das Projekt erreichen (Rolle manage nötig)
      description: 'Antwort ConnectionDTO[]: grantID, name, clientName, ownerID, ownerName, isOwn, role (Rolle des Besitzers, begrenzt die Verbindung),
        scopes, lastUsedAt. Nur Verbindungen, deren Besitzer das Projekt noch lesen darf.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'ConnectionDTO[]'}
        '403': {description: Rolle manage fehlt}
        '404': {description: Projekt unbekannt oder nicht sichtbar}
    put:
      operationId: addProjectConnection
      summary: Eigene Verbindung für das Projekt freigeben (Rolle manage nötig)
      description: 'Body {grantID}. Nur eigene, nicht widerrufene Verbindungen; wie PUT /oauth/grants/{id}/projects (das Konto braucht aktuell Zugriff).
        Antwort wie GET.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [grantID], properties: {grantID: {type: string, format: uuid}}}
      responses:
        '200': {description: 'ConnectionDTO[]'}
        '404': {description: fremde oder unbekannte Verbindung, Projekt nicht zugänglich}
        '409': {description: grant_revoked}
  /v1/projects/{id}/connections/{grantID}:
    delete:
      operationId: removeProjectConnection
      summary: Zugriff einer Verbindung auf das Projekt entziehen
      description: 'Besitzer der Verbindung oder Manager des Projekts. Die Verbindung selbst bleibt bestehen. Die letzte Projektfreigabe einer Verbindung
        ohne projects:write bleibt (400 projects_required); dann Verbindung widerrufen.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: grantID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: entzogen}
        '400': {description: projects_required}
        '404': {description: Verbindung erreicht das Projekt nicht}
  /v1/connection-access-requests/{id}/allow:
    post:
      operationId: allowConnectionAccessRequest
      summary: Hinweis "Verbindung wollte Projekt" - Zugriff erlauben
      description: 'Fügt das Projekt dem Grant hinzu (gleiche Regeln wie addProjectConnection) und markiert den Hinweis als erledigt.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: erlaubt}
        '404': {description: unbekannter oder fremder Hinweis, Projekt nicht mehr zugänglich}
        '409': {description: grant_revoked}
  /v1/connection-access-requests/{id}/ignore:
    post:
      operationId: ignoreConnectionAccessRequest
      summary: Hinweis ignorieren
      description: 'Der Hinweis erscheint nicht mehr; weitere Anfragen derselben Verbindung für dasselbe Projekt werden nur gezählt.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: ignoriert}
        '404': {description: unbekannter oder fremder Hinweis}
  /v1/settings/brain-mandate:
    get:
      operationId: getBrainMandate
      summary: Eigene Brain-Vollmachten lesen
      description: 'Antwort {mandates: [{grantID, grantName, projectIDs[], active, createdAt, updatedAt, revokedAt, lastUsedAt}]}, eine Zeile je Verbindung, zuletzt geändert zuerst, leer ohne Vollmacht. active ist false nach Widerruf oder wenn der Grant selbst widerrufen wurde. Seit 1.6.0 zusätzlich optional grantRevokedReason (person|replay|superseded|account_locked; fehlt, wenn aktiv oder unbekannt) und takenOver {fromGrantID, fromName, at} bei übernommenen Vollmachten.'
      responses:
        '200': {description: BrainMandateResponse}
        '401': {description: keine Personen-Sitzung (auch OAuth-Tokens)}
    put:
      operationId: putBrainMandate
      summary: Vollmacht einer Verbindung erteilen oder überschreiben
      description: 'Höchstens ein Mandat je Verbindung (Grant); eine Person kann mehreren Verbindungen je eine geben. Erneutes Erteilen für dieselbe Verbindung überschreibt deren Projekte und hebt einen Widerruf auf; Vollmachten anderer Verbindungen bleiben unberührt. Der Grant muss der Person gehören und darf nicht widerrufen sein; jedes Projekt muss die Person lesen können.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [grantID, projectIDs], properties: {grantID: {type: string, format: uuid}, projectIDs: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}}}
      responses:
        '200': {description: BrainMandateDTO}
        '400': {description: invalid_projects}
        '401': {description: keine Personen-Sitzung}
        '404': {description: fremder oder unbekannter Grant, Projekt nicht zugänglich}
        '409': {description: grant_revoked}
    delete:
      operationId: revokeAllBrainMandates
      summary: Alle Vollmachten widerrufen
      description: 'Widerruft jede aktive Vollmacht der Person auf einmal. Idempotent.'
      responses:
        '204': {description: widerrufen}
        '401': {description: keine Personen-Sitzung}
  /v1/settings/brain-mandate/{grantID}:
    delete:
      operationId: revokeBrainMandate
      summary: Vollmacht einer Verbindung widerrufen
      description: 'Wirkt sofort für die nächste Entscheidung dieser Verbindung (die Prüfung liest das Mandat unter Zeilensperre neu); die Vollmachten anderer Verbindungen bleiben. Idempotent, auch für unbekannte oder fremde IDs (204, nichts wird verraten). Bereits getroffene Entscheidungen bleiben.'
      parameters:
      - {name: grantID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: widerrufen}
        '400': {description: invalid_grant}
        '401': {description: keine Personen-Sitzung}
  /v1/settings/brain-mandate/audit:
    get:
      operationId: listBrainDecisionAudit
      summary: Protokoll der Entscheidungen unter allen Vollmachten
      description: 'Neueste zuerst, höchstens 200 (Entscheidungen und Verbindungsänderungen gemischt). Antwort {items: [{id, kind review.accepted|review.changes_requested|question.answered|plan.approved|plan.changes_requested|connection.project_added|connection.project_removed|connection.taken_over|mandate.taken_over, taskID (fehlt bei connection.* und mandate.taken_over), projectID, subjectID (Review/Frage/Plan, bei connection.* die geänderte Verbindung; bei connection.taken_over ohne gemeinsames Projekt ist projectID gleich subjectID), grantID (die entscheidende bzw. handelnde Verbindung), quote, note, createdAt}]}. Das Protokoll hat keine Fremdschlüssel auf Karte oder Verbindung und überdauert deren Löschung.'
      responses:
        '200': {description: BrainAuditResponse}
        '401': {description: keine Personen-Sitzung}
  /v1/project-groups:
    get:
      operationId: listProjectGroups
      summary: Eigene Projektgruppen
      description: 'Antwort {groups: [{id, name, projectIDs[]}]}; projectIDs nur die jetzt lesbaren Mitglieder, Gruppen nach Name.'
      responses:
        '200': {description: ProjectGroupListResponse}
        '401': {description: keine Personen-Sitzung (auch OAuth-Tokens)}
    post:
      operationId: createProjectGroup
      summary: Projektgruppe anlegen
      description: 'Body {name, projectIDs?}. Name 1-80 Zeichen, je Person ohne Gross/Klein eindeutig; Mitglieder muss die Person lesen koennen (sonst 404); höchstens 50 Gruppen mit je 200 Projekten. Antwort {group, changes[]}. Keine Vererbung auf Unterprojekte.'
      responses:
        '200': {description: ProjectGroupChangeResponse}
        '400': {description: 'invalid_name, invalid_projects, too_many_groups'}
        '401': {description: keine Personen-Sitzung}
        '404': {description: Projekt nicht zugaenglich}
        '409': {description: name_taken}
  /v1/project-groups/{id}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    - {name: dryRun, in: query, required: false, schema: {type: boolean}, description: 'true = nichts speichern, nur changes[] (Vorher/Nachher je Vollmacht und Verbindung) berechnen'}
    patch:
      operationId: updateProjectGroup
      summary: Name oder Mitglieder ändern (wirkt sofort)
      description: 'Body {name?, projectIDs?} (projectIDs ersetzt die Mitglieder). Antwort {group, changes: [{kind mandate|connection, grantID, name, added[], removed[]}]}. Wirkung auf eine aktive Vollmacht wird protokolliert.'
      responses:
        '200': {description: ProjectGroupChangeResponse}
        '401': {description: keine Personen-Sitzung}
        '404': {description: fremde oder unbekannte Gruppe, Projekt nicht zugaenglich}
        '409': {description: name_taken}
    delete:
      operationId: deleteProjectGroup
      summary: Gruppe löschen (wirkt sofort)
      description: 'Entzieht ihre Projekte allen Auswahlen, die sie einschliessen. War sie ausgeschlossen, bleiben ihre aktuellen Projekte einzeln ausgeschlossen (Loeschen erweitert nie). Antwort {changes[]}.'
      responses:
        '200': {description: ProjectGroupChangeResponse ohne group}
        '404': {description: fremde oder unbekannte Gruppe}
  /v1/projects/{id}/groups:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getProjectGroupsOfProject
      summary: Eigene Gruppen eines Projekts
      responses:
        '200': {description: '{groupIDs[], changes: []}'}
        '404': {description: Projekt nicht zugaenglich}
    put:
      operationId: setProjectGroupsOfProject
      summary: Eigene Gruppen eines Projekts setzen
      description: 'Body {groupIDs[]}; ?dryRun=true wie bei der Gruppe. Antwort {groupIDs[], changes[]}.'
      responses:
        '200': {description: ProjectGroupsOfProject}
        '404': {description: Projekt nicht zugaenglich oder fremde Gruppe}
  /v1/project-selection/preview:
    post:
      operationId: previewProjectSelection
      summary: Wirksame Projekte einer Auswahl, ohne zu speichern
      description: 'Body {projectIDs[], selection?}. Antwort {projectIDs[] (wirksam), agentCreatedProjectIDs[] (eigene Projekte, die all_except auslaesst, weil eine Verbindung sie angelegt hat)}.'
      responses:
        '200': {description: SelectionPreviewResponse}
        '400': {description: invalid_selection}
        '404': {description: fremde Gruppe}
x-project-selection:
  fields: {mode: 'selected (Standard) | all_except', groupIDs: 'UUID[] bis 50', excludedProjectIDs: 'UUID[] bis 500', excludedGroupIDs: 'UUID[] bis 50'}
  resolution: '(ausdrueckliche Projekte + Gruppen + bei all_except alle eigenen Projekte) minus ausgeschlossene Projekte und Gruppen, geschnitten mit den aktuellen Leserechten der Person. Ausschluss gewinnt. Eigen = Besitz als Person (Teamprojekte nicht), ohne per MCP create_project angelegte Projekte (vorlaeufig, ADR 0037).'
  response: 'selection {mode, projectIDs (ausdruecklich), groupIDs, excludedProjectIDs, excludedGroupIDs} oder null/fehlend'
x-mcp-tools:
  list_project_groups: {scope: 'projects:read', arguments: {}, result: '[{id, name, projects:[{id, name}]}], nur Gruppen mit von dieser Verbindung erreichbaren Projekten und nur diese; nur lesend'}
  list_connections: {scope: 'projects:read', arguments: {}, result: '[{grantID, name, clientName, scopes[], lastUsedAt, projects:[{id, name}]}] (die übrigen nicht widerrufenen Verbindungen derselben Person; projects nur aus der eigenen Vollmacht)', errors: 'brain_mandate_required (403)'}
  set_connection_projects: {scope: 'projects:write', required: [grantID], arguments: {grantID: UUID, addProjectIDs: 'UUID[] bis 50', removeProjectIDs: 'UUID[] bis 50, kein Überschnitt, zusammen mindestens eines', quote: 'string 1-2000, Pflicht (Linos Zitat)'}, result: '{grantID, name, projects:[{id, name}] (nur Vollmachtsprojekte, nach der Änderung), added[], removed[]}', errors: 'invalid_projects|invalid_id|invalid_arguments (400), cannot_change_own_connection (403), not_found (404: fremde oder unbekannte Verbindung, Projekt nicht lesbar), grant_revoked (409), brain_mandate_required (403), outside_brain_mandate (403, nichts wird angewendet), quote_required|invalid_quote (400), projects_required (400)', notes: 'Prüfreihenfolge in dieser Reihenfolge; idempotent; Hinzufügen verlangt aktuelle Leserechte der Person und markiert Zugriffshinweise als granted; Audit je tatsächlicher Änderung in derselben Transaktion; Vollmachten selbst bleiben unverändert.'}
