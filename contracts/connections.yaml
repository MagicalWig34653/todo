openapi: 3.0.3
info:
  title: Todolino MCP-Verbindungen im Teilen-Fenster
  version: 1.2.0
  description: 'ADR 0028. Eine MCP-Verbindung (OAuth-Grant) ist ein eigener Beteiligter eines Projekts neben Personen und Teams. Ihr Zugriff ist durch
    die Rechte der Person (wirksame Rolle) UND die Projektliste/Scopes des Grants begrenzt, nie größer als der Besitzer; es gibt keine eigene Rolle.
    Das Feld role der Antwort ist die aktuelle Rolle des Besitzers im Projekt. Name der Verbindung: Feld name von GET /oauth/grants
    (Standard = Clientname, änderbar per PATCH /oauth/grants/{id}). Zugriffshinweise: fragt eine Verbindung ein Projekt außerhalb ihres Grants an
    (MCP-Antwort unverändert not_found) und kann ihr Besitzer das Projekt lesen, entsteht je Verbindung und Projekt ein Hinweis (Anzahl, letzter
    Zeitpunkt, höchstens ein Zähler-Schritt je Minute); er erscheint in GET /v1/feed als accessRequests[] und in
    GET /v1/command-center summary.pendingAccessRequests. Erlauben fügt das Projekt dem Grant hinzu (Klick des Kontoinhabers ist die Bestätigung),
    Ignorieren schaltet den Hinweis still. Entschiedene Hinweise räumt cleanup-expired nach 7 Tagen auf, offene nach 30 Tagen ohne Wiederholung.
    1.1.0 (Brain-Vollmacht, ADR 0032): /v1/settings/brain-mandate. Die Person gibt höchstens einer ihrer Verbindungen eine Vollmacht für genau die genannten Projekte (keine Vererbung auf Unterprojekte); nur diese Verbindung darf mit decide_review/answer_question als Agent entscheiden. Verwaltung ausschließlich mit Personen-Sitzung, OAuth-Tokens erhalten 401; es gibt keinen MCP-Schreibweg.'
    1.2.0 (ADR 0032 Nachtrag 23.11.2026, Karte 2280A2F1): eine Vollmacht je Verbindung statt einer je Person. GET liefert {mandates: [...]} (Liste, zuletzt geändert zuerst; das bisherige Feld mandate entfällt), PUT erteilt/überschreibt die Vollmacht genau der genannten Verbindung und lässt die übrigen unberührt, DELETE /v1/settings/brain-mandate/{grantID} widerruft nur diese Verbindung, DELETE ohne ID widerruft alle. Sicherheitsregeln unverändert (kein MCP-Schreibweg, eigene Reviews/Fragen gesperrt, Widerruf sofort, Zitat-Pflicht, Audit).
security:
- bearerAuth: []
- sessionCookie: []
paths:
  /v1/projects/{id}/connections:
    get:
      operationId: listProjectConnections
      summary: Verbindungen, die das Projekt erreichen (Rolle manage nötig)
      description: 'Antwort ConnectionDTO[]: grantID, name, clientName, ownerID, ownerName, isOwn, role (Rolle des Besitzers, begrenzt die Verbindung),
        scopes, lastUsedAt. Nur Verbindungen, deren Besitzer das Projekt noch lesen darf.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'ConnectionDTO[]'}
        '403': {description: Rolle manage fehlt}
        '404': {description: Projekt unbekannt oder nicht sichtbar}
    put:
      operationId: addProjectConnection
      summary: Eigene Verbindung für das Projekt freigeben (Rolle manage nötig)
      description: 'Body {grantID}. Nur eigene, nicht widerrufene Verbindungen; wie PUT /oauth/grants/{id}/projects (das Konto braucht aktuell Zugriff).
        Antwort wie GET.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [grantID], properties: {grantID: {type: string, format: uuid}}}
      responses:
        '200': {description: 'ConnectionDTO[]'}
        '404': {description: fremde oder unbekannte Verbindung, Projekt nicht zugänglich}
        '409': {description: grant_revoked}
  /v1/projects/{id}/connections/{grantID}:
    delete:
      operationId: removeProjectConnection
      summary: Zugriff einer Verbindung auf das Projekt entziehen
      description: 'Besitzer der Verbindung oder Manager des Projekts. Die Verbindung selbst bleibt bestehen. Die letzte Projektfreigabe einer Verbindung
        ohne projects:write bleibt (400 projects_required); dann Verbindung widerrufen.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: grantID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: entzogen}
        '400': {description: projects_required}
        '404': {description: Verbindung erreicht das Projekt nicht}
  /v1/connection-access-requests/{id}/allow:
    post:
      operationId: allowConnectionAccessRequest
      summary: Hinweis "Verbindung wollte Projekt" - Zugriff erlauben
      description: 'Fügt das Projekt dem Grant hinzu (gleiche Regeln wie addProjectConnection) und markiert den Hinweis als erledigt.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: erlaubt}
        '404': {description: unbekannter oder fremder Hinweis, Projekt nicht mehr zugänglich}
        '409': {description: grant_revoked}
  /v1/connection-access-requests/{id}/ignore:
    post:
      operationId: ignoreConnectionAccessRequest
      summary: Hinweis ignorieren
      description: 'Der Hinweis erscheint nicht mehr; weitere Anfragen derselben Verbindung für dasselbe Projekt werden nur gezählt.'
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: ignoriert}
        '404': {description: unbekannter oder fremder Hinweis}
  /v1/settings/brain-mandate:
    get:
      operationId: getBrainMandate
      summary: Eigene Brain-Vollmachten lesen
      description: 'Antwort {mandates: [{grantID, grantName, projectIDs[], active, createdAt, updatedAt, revokedAt, lastUsedAt}]}, eine Zeile je Verbindung, zuletzt geändert zuerst, leer ohne Vollmacht. active ist false nach Widerruf oder wenn der Grant selbst widerrufen wurde.'
      responses:
        '200': {description: BrainMandateResponse}
        '401': {description: keine Personen-Sitzung (auch OAuth-Tokens)}
    put:
      operationId: putBrainMandate
      summary: Vollmacht einer Verbindung erteilen oder überschreiben
      description: 'Höchstens ein Mandat je Verbindung (Grant); eine Person kann mehreren Verbindungen je eine geben. Erneutes Erteilen für dieselbe Verbindung überschreibt deren Projekte und hebt einen Widerruf auf; Vollmachten anderer Verbindungen bleiben unberührt. Der Grant muss der Person gehören und darf nicht widerrufen sein; jedes Projekt muss die Person lesen können.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [grantID, projectIDs], properties: {grantID: {type: string, format: uuid}, projectIDs: {type: array, minItems: 1, maxItems: 200, items: {type: string, format: uuid}}}}
      responses:
        '200': {description: BrainMandateDTO}
        '400': {description: invalid_projects}
        '401': {description: keine Personen-Sitzung}
        '404': {description: fremder oder unbekannter Grant, Projekt nicht zugänglich}
        '409': {description: grant_revoked}
    delete:
      operationId: revokeAllBrainMandates
      summary: Alle Vollmachten widerrufen
      description: 'Widerruft jede aktive Vollmacht der Person auf einmal. Idempotent.'
      responses:
        '204': {description: widerrufen}
        '401': {description: keine Personen-Sitzung}
  /v1/settings/brain-mandate/{grantID}:
    delete:
      operationId: revokeBrainMandate
      summary: Vollmacht einer Verbindung widerrufen
      description: 'Wirkt sofort für die nächste Entscheidung dieser Verbindung (die Prüfung liest das Mandat unter Zeilensperre neu); die Vollmachten anderer Verbindungen bleiben. Idempotent, auch für unbekannte oder fremde IDs (204, nichts wird verraten). Bereits getroffene Entscheidungen bleiben.'
      parameters:
      - {name: grantID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: widerrufen}
        '400': {description: invalid_grant}
        '401': {description: keine Personen-Sitzung}
  /v1/settings/brain-mandate/audit:
    get:
      operationId: listBrainDecisionAudit
      summary: Protokoll der Entscheidungen unter allen Vollmachten
      description: 'Neueste zuerst, höchstens 200. Antwort {items: [{id, kind review.accepted|review.changes_requested|question.answered, taskID, projectID, subjectID, grantID, quote, note, createdAt}]}. Das Protokoll hat keine Fremdschlüssel auf Karte oder Verbindung und überdauert deren Löschung.'
      responses:
        '200': {description: BrainAuditResponse}
        '401': {description: keine Personen-Sitzung}
