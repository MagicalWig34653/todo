# Production-like reverse proxy for the test stack (the live proxy is Zoraxy, see docs/BETRIEB.md; nginx is the closest stand-in).
worker_processes 1;
events { worker_connections 1024; }
http {
  log_format cc '$remote_addr "$request" $status req_len=$request_length ct="$content_type" origin="$http_origin" sfs="$http_sec_fetch_site" proto=$server_protocol ua="$http_user_agent"';
  access_log /dev/stdout cc;
  upstream backend { server b1:8080; server b2:8080; server b3:8080; }   # 3 replicas like deploy/swarm/stack.yaml, round robin
  client_max_body_size 16m;
  proxy_read_timeout 60s; proxy_send_timeout 60s; proxy_connect_timeout 5s;
  server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
    }
    location /v1/sync/wait { proxy_pass http://backend; proxy_http_version 1.1; proxy_buffering off; proxy_set_header Host $http_host; }
  }
}
