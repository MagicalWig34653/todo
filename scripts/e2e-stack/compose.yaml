# Production-like test stack for browser E2E (card DA09D11A): MariaDB 12.3, 3 backend replicas of the published image
# (as deploy/swarm/stack.yaml), nginx with TLS + HTTP/2 in front. Test data only, own ports. Started by run.sh.
name: cc-stack
x-backend: &backend
  image: ghcr.io/magicalwig34653/todo-backend:${CC_TAG:-edge}
  depends_on:
    db: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  environment: &env
    DATABASE_DRIVER: mariadb
    DB_HOST: db
    DB_PORT: "3306"
    DB_NAME: todo_cc
    DB_USER: todo_cc
    DB_PASSWORD: cc-test-only
    RP_ID: localhost
    RP_NAME: Todolino
    RP_ORIGIN: ${CC_ORIGIN:-https://localhost:28111}
    OAUTH_ISSUER: ${CC_ORIGIN:-https://localhost:28111}
    BOOTSTRAP_TOKEN: dev-bootstrap-only
services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: cc-root-only
      MARIADB_DATABASE: todo_cc
      MARIADB_USER: todo_cc
      MARIADB_PASSWORD: cc-test-only
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  migrate:
    image: ghcr.io/magicalwig34653/todo-backend:${CC_TAG:-edge}
    depends_on: { db: { condition: service_healthy } }
    environment: *env
    command: [migrate, --yes]
    restart: "no"
  b1: { <<: *backend, command: [serve, --env, production, --hostname, 0.0.0.0, --port, "8080"] }
  b2: { <<: *backend, command: [serve, --env, production, --hostname, 0.0.0.0, --port, "8080"] }
  b3: { <<: *backend, command: [serve, --env, production, --hostname, 0.0.0.0, --port, "8080"] }
  proxy:
    image: nginx:1.27-alpine
    depends_on: [b1, b2, b3]
    ports: ["127.0.0.1:28110:80", "127.0.0.1:28111:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.tls:/etc/nginx/tls:ro
