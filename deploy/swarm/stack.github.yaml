version: '3.8'
# Optional overlay: ONE GitHub App of the operator; every person connects their own installation in the PWA
# (ADR 0042 addendum, docs/GITHUB-APP-EINRICHTUNG.md). scripts/swarm-deploy.sh adds this file automatically when
# GITHUB_APP_ENABLED=true is set in the env file.
# Needs two external Swarm secrets (names via GITHUB_APP_KEY_SECRET and GITHUB_APP_CLIENT_SECRET_SECRET):
#   docker secret create todo_github_app_key ./todolino-app.private-key.pem
#   printf '%s' "<client secret of the app>" | docker secret create todo_github_app_client_secret -
# Both are mounted as files (/run/secrets/...) and never appear in the image, the env file or the repository.
# GITHUB_APP_INSTALLATION_ID and GITHUB_APP_REPOSITORIES are the old per-instance variables: optional, only for repositories of the
# operator (transition). Empty values count as unset.
x-github: &github
  environment:
    GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID required}
    GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?GITHUB_APP_SLUG required}
    GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?GITHUB_APP_CLIENT_ID required}
    GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
    GITHUB_APP_REPOSITORIES: ${GITHUB_APP_REPOSITORIES:-}
    GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key
    GITHUB_APP_CLIENT_SECRET_FILE: /run/secrets/github_app_client_secret
  secrets: [github_app_key, github_app_client_secret]
services:
  migrate: *github
  backend: *github
  backend-pinned: *github
secrets:
  github_app_key:
    external: true
    name: ${GITHUB_APP_KEY_SECRET:-todo_github_app_key}
  github_app_client_secret:
    external: true
    name: ${GITHUB_APP_CLIENT_SECRET_SECRET:-todo_github_app_client_secret}
