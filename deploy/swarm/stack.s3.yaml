version: '3.8'
# Optional overlay: S3-compatible attachment storage. Not needed with the default ATTACHMENT_STORAGE=database.
# scripts/swarm-deploy.sh adds this file automatically when S3_ENDPOINT is set.
# Either set ATTACHMENT_STORAGE=s3 (new uploads go to S3) or keep the default and use it only to read or migrate
# existing S3 attachments (`attachments migrate-storage --from s3 --to database`).
# Needs the external Swarm secrets todo_s3_access_key / todo_s3_secret_key (names via S3_ACCESS_KEY_SECRET / S3_SECRET_KEY_SECRET).
x-s3: &s3
  environment:
    S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT required}
    S3_BUCKET: ${S3_BUCKET:-todo-attachments}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
    S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
  secrets: [s3_access_key, s3_secret_key]
services:
  migrate: *s3
  backend: *s3
secrets:
  s3_access_key:
    external: true
    name: ${S3_ACCESS_KEY_SECRET:-todo_s3_access_key}
  s3_secret_key:
    external: true
    name: ${S3_SECRET_KEY_SECRET:-todo_s3_secret_key}
