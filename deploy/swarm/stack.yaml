version: '3.8'
# Swarm stack: API replicas plus a one-shot migration service.
# MariaDB is EXTERNAL (not part of this stack). Attachments are stored in the database by default;
# optional S3-compatible storage is added with the overlay file stack.s3.yaml (see scripts/swarm-deploy.sh).
# Configure via deploy/swarm/stack.env.example (copy, fill, `set -a; . file; set +a`)
# and the external Swarm secrets referenced at the bottom.
x-backend: &backend
  image: ghcr.io/magicalwig34653/todo-backend:${TODO_IMAGE_TAG:-edge}
  networks: [internal]
  environment: &environment
    DATABASE_DRIVER: mariadb
    DB_HOST: ${DB_HOST:?DB_HOST required}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-todo}
    DB_USER: ${DB_USER:-todo}
    DB_PASSWORD_FILE: /run/secrets/db_password
    BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-database}
    ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
    RP_ID: ${RP_ID:-localhost}
    RP_ORIGIN: ${RP_ORIGIN:-http://localhost:38080}
    AASA_APP_IDS: ${AASA_APP_IDS:-}
    PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
  secrets: [db_password, bootstrap_token]
services:
  migrate:
    <<: *backend
    command: [migrate, --yes]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
  backend:
    <<: *backend
    command: [serve, --env, production, --hostname, 0.0.0.0, --port, '8080']
    configs:
      - source: healthcheck
        target: /healthcheck.sh
    healthcheck:
      test: [CMD, /bin/bash, /healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - target: 8080
        published: ${BACKEND_PORT:-38080}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
      resources:
        limits:
          cpus: '${BACKEND_CPU_LIMIT:-0}'
          memory: ${BACKEND_MEMORY_LIMIT:-0}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
networks:
  internal:
    driver: overlay
    attachable: true
configs:
  healthcheck:
    file: ./healthcheck.sh
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-todo_db_password}
  bootstrap_token:
    external: true
    name: ${BOOTSTRAP_TOKEN_SECRET:-todo_bootstrap_token}
