version: '3.8'
# Swarm stack: API replicas plus a one-shot migration service.
# MariaDB and S3-compatible storage are EXTERNAL (not part of this stack).
# Configure via deploy/swarm/stack.env.example (copy, fill, `set -a; . file; set +a`)
# and the external Swarm secrets referenced at the bottom.
x-backend: &backend
  image: ghcr.io/magicalwig34653/todo-backend:${TODO_IMAGE_TAG:-latest}
  networks: [internal]
  environment: &environment
    DATABASE_DRIVER: mariadb
    DB_HOST: ${DB_HOST:?DB_HOST required}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-todo}
    DB_USER: ${DB_USER:-todo}
    DB_PASSWORD_FILE: /run/secrets/db_password
    BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT required}
    S3_BUCKET: ${S3_BUCKET:-todo-attachments}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
    S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    RP_ID: ${RP_ID:-localhost}
    RP_ORIGIN: ${RP_ORIGIN:-http://localhost:38080}
    AASA_APP_IDS: ${AASA_APP_IDS:-}
    PASSWORD_LOGIN_ENABLED: 'false'
  secrets: [db_password, bootstrap_token, s3_access_key, s3_secret_key]
services:
  migrate:
    <<: *backend
    command: [migrate, --yes]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
  backend:
    <<: *backend
    command: [serve, --env, production, --hostname, 0.0.0.0, --port, '8080']
    configs:
      - source: healthcheck
        target: /healthcheck.sh
    healthcheck:
      test: [CMD, /bin/bash, /healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - target: 8080
        published: ${BACKEND_PORT:-38080}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
networks:
  internal:
    driver: overlay
    attachable: true
configs:
  healthcheck:
    file: ./healthcheck.sh
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-todo_db_password}
  bootstrap_token:
    external: true
    name: ${BOOTSTRAP_TOKEN_SECRET:-todo_bootstrap_token}
  s3_access_key:
    external: true
    name: ${S3_ACCESS_KEY_SECRET:-todo_s3_access_key}
  s3_secret_key:
    external: true
    name: ${S3_SECRET_KEY_SECRET:-todo_s3_secret_key}
