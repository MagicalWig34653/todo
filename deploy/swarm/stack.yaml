version: '3.8'
# Swarm stack: API replicas plus a one-shot migration service.
# MariaDB is EXTERNAL (not part of this stack). Attachments are stored in the database by default;
# optional S3-compatible storage is added with the overlay file stack.s3.yaml (see scripts/swarm-deploy.sh).
# Configure via deploy/swarm/stack.env.example (copy, fill, `set -a; . file; set +a`)
# and the external Swarm secrets referenced at the bottom.
x-backend: &backend
  image: ghcr.io/magicalwig34653/todo-backend:${TODO_IMAGE_TAG:-edge}
  networks: [internal]
  environment: &environment
    DATABASE_DRIVER: mariadb
    DB_HOST: ${DB_HOST:?DB_HOST required}
    DB_PORT: ${DB_PORT:-3306}
    DB_NAME: ${DB_NAME:-todo}
    DB_USER: ${DB_USER:-todo}
    DB_PASSWORD_FILE: /run/secrets/db_password
    BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-}
    ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
    RP_ID: ${RP_ID:-localhost}
    RP_ORIGIN: ${RP_ORIGIN:-http://localhost:38080}
    # Empty: the backend derives the OAuth/MCP issuer from RP_ORIGIN (older env files keep working).
    OAUTH_ISSUER: ${OAUTH_ISSUER:-}
    # ADR 0025: an empty value means "not set by the environment" - the setting can then be changed in the PWA
    # (Einstellungen > Verwaltung > Server). A non-empty value locks it there. Defaults live in the application.
    # Periodic in-process cleanup (0 disables) and sync log retention in days (0 keeps everything). ADR 0019.
    CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-}
    SYNC_RETENTION_DAYS: ${SYNC_RETENTION_DAYS:-}
    AASA_APP_IDS: ${AASA_APP_IDS:-}
    PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-}
  secrets: [db_password, bootstrap_token]
# Shared by backend and backend-pinned.
x-backend-deploy: &backend-deploy
  resources:
    limits:
      cpus: '${BACKEND_CPU_LIMIT:-0}'
      memory: ${BACKEND_MEMORY_LIMIT:-0}
  update_config:
    parallelism: 1
    delay: 5s
    order: start-first
    monitor: 60s
    failure_action: rollback
  rollback_config:
    parallelism: 1
    order: stop-first
  restart_policy:
    condition: on-failure
    delay: 5s
services:
  migrate:
    <<: *backend
    command: [migrate, --yes]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
  backend:
    <<: *backend
    command: &serve-command [serve, --env, production, --hostname, 0.0.0.0, --port, '8080']
    configs: &serve-configs
      - source: healthcheck
        target: /healthcheck.sh
    healthcheck: &serve-healthcheck
      test: [CMD, /bin/bash, /healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - target: 8080
        published: ${BACKEND_PORT:-38080}
        protocol: tcp
        mode: ingress
    deploy:
      <<: *backend-deploy
      replicas: ${BACKEND_REPLICAS:-3}
  # Optional extra API service pinned to one node (PINNED_NODE, see deploy/swarm/placement.sh). It sits in the base file
  # with 0 replicas so that removing PINNED_NODE scales it down again (an overlay-only service would keep running).
  # It publishes no port of its own (BACKEND_PINNED_PORT adds one); the ingress port belongs to backend.
  # EXCLUDE_LABEL deliberately does not apply here: PINNED_NODE is an explicit placement wish.
  backend-pinned:
    <<: *backend
    command: *serve-command
    configs: *serve-configs
    healthcheck: *serve-healthcheck
    deploy:
      <<: *backend-deploy
      replicas: ${BACKEND_PINNED_EFFECTIVE_REPLICAS:-0}
      placement:
        constraints:
          - ${BACKEND_PINNED_CONSTRAINT:-node.hostname == __no-pinned-node__}
networks:
  internal:
    driver: overlay
    attachable: true
configs:
  healthcheck:
    file: ./healthcheck.sh
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-todo_db_password}
  bootstrap_token:
    external: true
    name: ${BOOTSTRAP_TOKEN_SECRET:-todo_bootstrap_token}
