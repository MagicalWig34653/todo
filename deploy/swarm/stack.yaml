version: '3.8'
# Test baseline. Replace S3Mock and supply TLS ingress before production use.
x-backend: &backend
  image: ${BACKEND_IMAGE:-todo-dev-backend:local}
  networks: [internal]
  environment: &environment
    DATABASE_DRIVER: mariadb
    DB_HOST: db
    DB_PORT: '3306'
    DB_NAME: todo
    DB_USER: todo
    DB_PASSWORD_FILE: /run/secrets/db_password
    BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    RP_ID: ${RP_ID:-localhost}
    RP_ORIGIN: ${RP_ORIGIN:-http://localhost:38080}
    PASSWORD_LOGIN_ENABLED: 'false'
  secrets: [db_password, bootstrap_token]
services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: todo
      MARIADB_USER: todo
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    networks: [internal]
    volumes: [db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.todo.data == true]
      update_config:
        order: stop-first
  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: todo-attachments
    networks: [internal]
    deploy:
      replicas: 1
  migrate:
    <<: *backend
    command: [migrate, --yes]
    deploy:
      replicas: 0
      restart_policy:
        condition: none
  backend:
    <<: *backend
    command: [serve, --env, production, --hostname, 0.0.0.0, --port, '8080']
    configs:
      - source: healthcheck
        target: /healthcheck.sh
    healthcheck:
      test: [CMD, /bin/bash, /healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - target: 8080
        published: ${BACKEND_PORT:-38080}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: ${BACKEND_REPLICAS:-3}
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
networks:
  internal:
    driver: overlay
    attachable: true
volumes:
  db:
configs:
  healthcheck:
    file: ./healthcheck.sh
secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:-todo_db_password}
  db_root_password:
    external: true
    name: ${DB_ROOT_PASSWORD_SECRET:-todo_db_root_password}
  bootstrap_token:
    external: true
    name: ${BOOTSTRAP_TOKEN_SECRET:-todo_bootstrap_token}
