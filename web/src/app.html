<!doctype html>
<html lang="en">
	<head>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32 48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Pre-paint: apply the cached appearance before first render (mirrors lib/theme.svelte.ts; keys use the todo. prefix).
			try {
				var d = document.documentElement;
				var m = localStorage.getItem('todo.theme');
				if (m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) d.classList.add('dark');
				var g = localStorage.getItem('todo.glow');
				d.dataset.glow = g === 'off' || g === 'subtle' || g === 'medium' || g === 'strong' ? g : 'subtle';
				if (localStorage.getItem('todo.transparency') === 'reduced') d.dataset.transparency = 'reduced';
				var a = localStorage.getItem('todo.accent');
				if (a && /^#[0-9a-f]{6}$/.test(a)) d.style.setProperty('--ui-accent', a);
			} catch (e) {
				document.documentElement.dataset.glow = 'subtle';
				if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
			}
		</script>
		<script>
			// Version skew after a deploy (stale page or a mixed rollout answers 404 for old hashed chunks):
			// drop service worker and shell caches and reload once. The guard prevents reload loops.
			addEventListener('unhandledrejection', function (e) {
				var msg = String((e.reason && e.reason.message) || e.reason || '');
				if (!/Importing a module script failed|Failed to fetch dynamically imported module|error loading dynamically imported module/i.test(msg)) return;
				try {
					var last = Number(sessionStorage.getItem('todo.chunkReload') || 0);
					if (Date.now() - last < 60000) return;
					sessionStorage.setItem('todo.chunkReload', String(Date.now()));
				} catch (err) {
					return;
				}
				var done = function () { location.reload(); };
				var work = [];
				if (navigator.serviceWorker) work.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
				if (window.caches) work.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
				Promise.all(work).then(done, done);
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
