name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (swift build/test, SQLite)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: swift build
      - name: Third-party notices match the resolved BoringSSL copies
        run: scripts/check-third-party-notices.sh
      - name: Test (SQLite; MariaDB-only tests are skipped)
        run: swift test
      # Real backend + operator command `delete-account` (cards BCA27B3D, 69439B31); the scratch SQLite lives in RUNNER_TEMP.
      - name: Account deletion E2E (native backend, REST, delete-account)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/account-deletion-e2e.sh "$RUNNER_TEMP/account-deletion-e2e"
      # Operator commands with --yes through the real binary (card 300B3A20): settings rotate-key, push-test.
      - name: Operator commands E2E (--yes)
        run: |
          apt-get install -y -qq uuid-runtime openssl
          scripts/operator-commands-e2e.sh "$RUNNER_TEMP/operator-commands-e2e"
      # Project lists of other connections changed by a mandated connection (card E71B0FF1): real backend, REST + MCP with OAuth tokens.
      - name: Connection projects E2E (brain mandate, MCP)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/connection-projects-e2e.sh "$RUNNER_TEMP/connection-projects-e2e"
      # Overview block now, compact answer and ending a session status (card 692891DF): real backend, REST + MCP with an OAuth token, time shift via sqlite3.
      - name: Overview now E2E (now block, compact, ended sessions)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/overview-now-e2e.sh "$RUNNER_TEMP/overview-now-e2e"
      # Extended recurrence rules (card 21CF716D): weekdays, basis completion, monthDay; real backend, REST + MCP with an OAuth token.
      - name: Recurrence rules E2E (weekdays, completion basis, month day)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/recurrence-rules-e2e.sh "$RUNNER_TEMP/recurrence-rules-e2e"
      # Card pipeline, stage 1 (card 74EC341D): plan, approval, step states, brain mandate; real backend, REST + MCP with OAuth tokens.
      - name: Pipeline E2E (plan approval, step states)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/pipeline-e2e.sh "$RUNNER_TEMP/pipeline-e2e"
      # Cost efficiency (card 71FD73CF): usage reports via REST and MCP, hand-calculated summary, settings, account deletion.
      - name: Usage E2E (cost efficiency, report_usage)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/usage-e2e.sh "$RUNNER_TEMP/usage-e2e"
      # GitHub per person (card E51E8B8C): two people connect their own installation of the operator's app against a GitHub stand-in
      # and never see or use each other's; real backend, REST. (Pull requests from a real SFTP server need Docker: run locally.)
      - name: GitHub connect E2E (two people, own installations)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl git openssh-client
          E2E_NO_SFTP=1 scripts/github-e2e.sh api "$RUNNER_TEMP/github-e2e"
      # Responsibility (card 8B4BAC2E, ADR 0043): an agent assigns over MCP, "for me" delivers it to that person only; real backend, OAuth token.
      - name: Assignment E2E (responsibility, for me, MCP)
        run: |
          apt-get update -qq && apt-get install -y -qq sqlite3 python3 curl openssl uuid-runtime
          scripts/assignment-e2e.sh "$RUNNER_TEMP/assignment-e2e"

  deploy-scripts:
    name: Deploy scripts (settings.sh, offline)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Stubs for docker, whiptail, openssl, update.sh and swarm-deploy.sh; no network, no Swarm. Needs bash 4.4+ (ubuntu-24.04 has 5.2).
      - name: settings.sh (menu, CLI, secrets, atomic write)
        run: scripts/test-settings.sh
      - name: deploy branch file list (settings.sh runtime files)
        run: scripts/test-deploy-branch.sh

  web:
    name: PWA (check, build, vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      # Playwright E2E runs in its own workflow (.github/workflows/e2e.yml) against the image "Docker publish" builds from the same
      # commit; it needs a backend with a fresh database per spec (scripts/e2e-ci.sh), which this job does not have.
